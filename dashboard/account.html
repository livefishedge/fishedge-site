<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FishEdge — My Account</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #050b10; --fg: #e0e6ee; --accent: #1a7f7a; --accent2: #2dd4bf; --panel: rgba(5,11,16,0.97); --border: #1b2836; --err: #ff6b6b; --success: #2dd4bf; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; background: var(--bg); color: var(--fg); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #account-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: var(--accent2); }
    .subtitle { font-size: 0.85rem; opacity: 0.6; margin-bottom: 28px; line-height: 1.5; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .info-row:last-child { border-bottom: none; }
    .info-label { opacity: 0.6; font-size: 0.78rem; }
    .info-value { font-weight: 600; text-align: right; }
    #verified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--success); background: rgba(45,212,191,0.12); padding: 2px 8px; border-radius: 20px; margin-top: 2px; }
    #unverified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; color: #fbbf24; background: rgba(251,191,36,0.12); padding: 2px 8px; border-radius: 20px; margin-top: 2px; }
    #logout-btn {
      width: 100%; padding: 12px; background: transparent; border: 1px solid var(--err); color: var(--err);
      border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.15s; margin-top: 24px;
    }
    #logout-btn:hover { background: rgba(255,107,107,0.1); }
    .back-link { font-size: 0.82rem; text-align: center; margin-top: 14px; opacity: 0.5; }
    .back-link a { color: var(--accent2); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }

    /* Confirmation page state */
    .confirm-card { text-align: center; }
    .confirm-card h1 { margin-bottom: 12px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent2);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok { color: var(--success); }
    .err { color: var(--err); }
  </style>
</head>
<body>
<div id="account-card">
  <!-- Dynamic content injected here -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js?v=20260531"></script>
<script src="supabase-init.js?v=20260806c"></script>
<script>
(function() {
  var sb = window.sb;
  var card = document.getElementById('account-card');

  function renderConfirm(state, message) {
    var cls = state === 'ok' ? 'ok' : (state === 'err' ? 'err' : '');
    card.innerHTML =
      '<div class="confirm-card">' +
        '<h1 class="' + cls + '">' + (state === 'ok' ? 'Email Confirmed!' : (state === 'err' ? 'Confirmation Failed' : 'Verifying…')) + '</h1>' +
        (state === 'loading' ? '<div class="spinner"></div>' : '') +
        '<p class="' + cls + '" style="opacity:0.8;line-height:1.5">' + message + '</p>' +
        (state === 'ok' ? '<a href="index.html" style="display:block;text-align:center;padding:13px;background:var(--accent2);color:#050b10;border-radius:8px;font-size:1rem;font-weight:700;text-decoration:none;margin-top:22px;">Open FishEdge Dashboard</a>' : '') +
      '</div>';
  }

  function renderAccount(user, profile) {
    var name = profile && profile.name ? profile.name : '—';
    var region = profile && profile.selected_region ? profile.selected_region : '—';
    var phone = profile && profile.phone ? profile.phone : '—';
    var regionLabel = region === 'usec_south' ? 'US East Coast — South-Atlantic' :
                      region === 'usec_md' ? 'US East Coast — Mid-Atlantic' : region;
    var emailVerified = user.email_confirmed_at ? true : false;

    card.innerHTML =
      '<h1>My Account</h1>' +
      '<p class="subtitle">Manage your profile and sign out.</p>' +
      '<div class="info-row"><div><div class="info-label">Name</div><div class="info-value">' + name + '</div></div></div>' +
      '<div class="info-row"><div><div class="info-label">Email</div><div class="info-value">' + user.email + '</div></div></div>' +
      '<div class="info-row"><div><div class="info-label">Phone</div><div class="info-value">' + phone + '</div></div></div>' +
      '<div class="info-row"><div><div class="info-label">Region</div><div class="info-value">' + regionLabel + '</div></div></div>' +
      '<div class="info-row"><div><div class="info-label">Email</div><div class="info-value">' +
        (emailVerified
          ? '<span id="verified-badge">✓ Verified</span>'
          : '<span id="unverified-badge">✗ Unverified</span>') +
      '</div></div></div>' +
      '<button id="logout-btn" type="button">Sign out</button>' +
      '<button id="edit-profile-btn" type="button" style="width:100%;padding:12px;background:transparent;border:1px solid var(--accent2);color:var(--accent2);border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;transition:background 0.15s;margin-top:10px;">Edit Profile</button>' +
      '<a href="index.html" style="display:block;text-align:center;padding:13px;background:var(--accent2);color:#050b10;border-radius:8px;font-size:1rem;font-weight:700;text-decoration:none;margin-top:16px;">Captain\'s Dashboard</a>';
  }

  function renderNotAuth() {
    card.innerHTML =
      '<h1 style="color:var(--accent2)">Not signed in</h1>' +
      '<p class="subtitle">You need to sign in to view your account.</p>' +
      '<div class="back-link"><a href="login.html">Sign in</a></div>';
  }

  async function init() {
    // Check for returning from email confirmation link (session may be set in URL)
    var _ref = await sb.auth.getSession();
    var session = _ref.data.session;

    if (session) {
      var user = session.user;
      if (!user.email_confirmed_at) {
        try { sessionStorage.setItem('email_verification_required', 'true'); } catch(e) {}
        await sb.auth.signOut();
        window.location.replace('login.html');
        return;
      }
      // Email is confirmed. Clear the "pending verification" stash so login.html's
      // loud red banner does not auto-show on the captain's next cold visit.
      try { localStorage.removeItem('fishedge:pending_verification'); } catch(e) {}
      // Fetch profile
      var profile = null;
      try {
        var r = await fetch(
          'https://wfdpfeptmyiqifgwqpzu.supabase.co/rest/v1/profiles?user_id=eq.' + user.id + '&select=name,phone,selected_region',
          { headers: { 'apikey': 'sb_publishable_W6wnJkT70jb69JUZgM1dow_nabPZycR', 'Authorization': 'Bearer ' + session.access_token } }
        );
        if (r.ok) {
          var arr = await r.json();
          if (arr && arr.length > 0) profile = arr[0];
        }
      } catch(e) {}

      // If this is a fresh confirmation (no profile at all yet), redirect to viewer
      // Otherwise show the account page (phone/region may be null but we show the page)
      if (!profile) {
        renderConfirm('ok', 'Signup successful — your email is verified and your FishEdge account is ready.');
        return;
      }

      renderAccount(user, profile);
      attachLogout();
      attachEditProfile();
    } else {
      // No session. The captain may have just clicked an *expired* confirmation
      // link — Supabase redirects with #error_code=otp_expired (and friends) when
      // the token has aged past OTP_EXPIRY (default 1h). Auto-resend using the
      // email stashed at signup so captains don't get stranded at this gate.
      var hash = String(window.location.hash || '');
      var hashParams = new URLSearchParams(hash.substring(1));
      var errorCode = hashParams.get('error_code') || '';
      var errorDesc = hashParams.get('error_description') || '';
      var isExpiredLink = errorCode === 'otp_expired'
        || /expired/i.test(errorDesc)
        || /invalid/i.test(errorDesc);

      if (isExpiredLink) {
        // Strip the stale hash so it doesn't get re-parsed on refresh.
        try {
          history.replaceState(null, '',
            window.location.pathname + window.location.search);
        } catch (e) {}

        var pendingEmail = null;
        try {
          pendingEmail = localStorage.getItem('fishedge:pending_verification');
        } catch (e) {}

        if (pendingEmail) {
          // Render an explicit "link expired" page with a Resend button.
          // Auto-firing resend on mount would send an email the captain didn't
          // ask for; making it explicit gives them control and surfaces what
          // actually happened.
          renderExpired(pendingEmail);
          return;
        }

        // No stashed email (cookies cleared, or they registered on a different
        // device). Send them to verify-email.html where they can re-enter their
        // address.
        renderConfirm('err',
          'That confirmation link has expired. ' +
          '<a href="verify-email.html" style="color:var(--accent2);text-decoration:underline">Send a fresh one</a>.');
        return;
      }

      // No session, no expired-link signature — stale tab or other route.
      window.location.replace('login.html');
    }
  }

  function renderResent(message) {
    card.innerHTML =
      '<div class="confirm-card">' +
        '<h1 class="ok">Fresh Confirmation Sent</h1>' +
        '<p class="ok" style="opacity:0.85;line-height:1.5">' + message + '</p>' +
        '<a href="login.html" style="display:block;text-align:center;padding:13px;background:var(--accent2);color:#050b10;border-radius:8px;font-size:1rem;font-weight:700;text-decoration:none;margin-top:22px;">Back to Sign In</a>' +
      '</div>';
  }

  // "Link expired" page with a Resend button. Auto-resend on mount would
  // surprise the captain with an email they didn't ask for; this gives them
  // explicit control.
  function renderExpired(email) {
    card.innerHTML =
      '<div class="confirm-card">' +
        '<h1 class="err">Link Expired</h1>' +
        '<p class="err" style="opacity:0.85;line-height:1.5">' +
          'Your confirmation link expired — they only last one hour. ' +
          'We can send a fresh one to <strong>' + email + '</strong>.' +
        '</p>' +
        '<button id="resend-expired-btn" type="button" ' +
          'style="width:100%;padding:13px;margin-top:22px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer">Resend Confirmation Email</button>' +
        '<div id="resend-expired-status" role="status" aria-live="polite" ' +
          'style="display:none;margin-top:12px;font-size:0.85rem;line-height:1.4"></div>' +
        '<a href="login.html" style="display:block;text-align:center;margin-top:14px;font-size:0.85rem;color:var(--accent2);text-decoration:none">Back to Sign In</a>' +
      '</div>';

    var btn = document.getElementById('resend-expired-btn');
    var statusEl = document.getElementById('resend-expired-status');

    function setStatus(text, cls) {
      statusEl.textContent = text || '';
      statusEl.className = cls || '';
      statusEl.style.display = text ? 'block' : 'none';
      if (cls === 'err')  statusEl.style.color = '#fca5a5';
      if (cls === 'sent') statusEl.style.color = '#5eead4';
    }

    btn.addEventListener('click', async function () {
      btn.disabled = true;
      btn.textContent = 'Sending…';
      setStatus('', '');
      var redirectTo = window.omvAuthRedirectUrl
        ? window.omvAuthRedirectUrl('account.html')
        : new URL('account.html',
            'https://app.fishedge.live/dashboard/signup-success.html').href;
      var res = await sb.auth.resend({
        type: 'signup',
        email: email,
        options: { emailRedirectTo: redirectTo }
      });
      if (res && res.error) {
        // Most common: over_email_send_rate_limit. Show it verbatim so the
        // captain knows whether to wait a minute or try something else.
        btn.disabled = false;
        btn.textContent = 'Resend Confirmation Email';
        setStatus(res.error.message || 'Could not resend. Try again in a minute.', 'err');
        return;
      }
      // Success — flip to the "fresh email sent" confirmation screen.
      renderResent(
        'A fresh confirmation link is on its way to <strong>' + email + '</strong>. ' +
        'Open it within 24 hours this time and you\'re in.');
    });
  }

  function attachLogout() {
    var btn = document.getElementById('logout-btn');
    if (!btn) return;
    btn.addEventListener('click', async function() {
      btn.disabled = true;
      btn.textContent = 'Signing out…';
      await sb.auth.signOut();
      window.location.replace('login.html');
    });
  }

  function attachEditProfile() {
    var btn = document.getElementById('edit-profile-btn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      window.location.href = 'profile-edit.html';
    });
  }

  init();
})();
</script>
</body>
</html>
