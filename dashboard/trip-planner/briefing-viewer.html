<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefing Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #050b10; color: #b3e5fc; overflow: hidden; }

    .bv-toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: rgba(5, 11, 16, 0.95);
      border-bottom: 1px solid #1b2836; backdrop-filter: blur(6px);
      flex-wrap: wrap;
    }
    .bv-back { color: #4fc3f7; text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid #2a3a4d; border-radius: 4px; }
    .bv-back:hover { background: #1b2836; }
    .bv-title { margin: 0; font-size: 15px; font-weight: 600; color: #e3f2fd; }
    .bv-time { font-size: 12px; color: #9fb0c3; margin-left: 4px; font-family: monospace; }

    .bv-products { display: none; }
    .bv-products button {
      background: #1b2836; color: #b3e5fc; border: 1px solid #2a3a4d;
      padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .bv-products button:hover { background: #2a3a4d; }
    .bv-products button.active {
      background: #4fc3f7; color: #050b10; border-color: #4fc3f7; font-weight: 600;
    }
    .bv-products .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    /* Hamburger button + menu panel (port of dashboard/index.html #hamburger-btn
       + #menu-panel styles so the briefing viewer feels native to FishEdge). */
    #bv-hamburger-btn{
      position:fixed; top:6px; right:6px; z-index:2201;
      width:36px; height:36px; border:2px solid rgba(255,255,255,0.72); border-radius:7px;
      background:rgba(9,74,132,0.96); color:#fff; font-size:21px; font-weight:900; cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,0.62); padding:0;
    }
    #bv-menu-panel{
      position:fixed; top:54px; right:8px; z-index:2200;
      width:clamp(280px, 82vw, 360px); max-width:calc(100vw - 16px); min-width:280px;
      display:none; flex-direction:column; gap:10px; padding:12px;
      background:rgba(5,11,16,0.94); border:1px solid rgba(255,255,255,0.22); border-radius:8px;
      box-shadow:0 12px 30px rgba(0,0,0,0.45); backdrop-filter:blur(8px);
      box-sizing:border-box; max-height:min(640px, calc(100dvh - 66px)); overflow:auto;
      touch-action:pan-y !important; overscroll-behavior:contain; -webkit-text-size-adjust:100%; zoom:1 !important;
    }
    #bv-menu-panel.open{ display:flex; }
    #bv-menu-panel .bv-section{ display:flex; flex-direction:column; gap:6px; }
    #bv-menu-panel .bv-section-title{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#7a8fa8; }
    #bv-menu-panel .bv-layers{ display:flex; flex-direction:column; gap:6px; margin:0; padding:0; border:none; background:transparent; white-space:normal; }
    #bv-menu-panel label{ display:flex; flex-direction:row; align-items:center; gap:8px; font-size:13px; font-weight:800; color:#d6e5f2; cursor:pointer; padding:6px 8px; border-radius:6px; }
    #bv-menu-panel label:hover{ background:rgba(77,125,255,0.12); }
    #bv-menu-panel label.disabled{ color:#5a6b7d; cursor:not-allowed; }
    #bv-menu-panel label.disabled:hover{ background:transparent; }
    #bv-menu-panel input[type="checkbox"]{ width:18px; height:18px; accent-color:#4fc3f7; margin:0; }
    #bv-menu-panel .bv-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:2px; }
    #bv-menu-panel .dot-temp{ background:#ff8c00; }
    #bv-menu-panel .dot-wave{ background:#00c8ff; }
    #bv-menu-panel .dot-swell{ background:#8bd7ff; }
    #bv-menu-panel .dot-composite{ background:#ffb3d1; box-shadow:0 0 0 1px #000 inset; }
    #bv-menu-panel .dot-wind{ background:#62e58a; }
    #bv-menu-panel .dot-press{ background:#c59bff; }
    #bv-menu-panel .dot-tide{ background:#4fc3f7; }
    #bv-menu-panel .bv-status{ font-size:11px; color:#9fb0c3; padding:6px 8px; border-top:1px solid rgba(255,255,255,0.1); }
    #bv-menu-panel .bv-briefing-source{ font-size:10px; color:#7a8fa8; margin-top:-3px; }

    /* Briefing details live inside the hamburger menu so the map remains
       unobstructed. */
    #bv-side-panel{
      position:static;
      width:auto;
      display:flex; flex-direction:column; gap:8px;
      padding:0;
      background:transparent; border:0; border-radius:0;
      box-shadow:none; backdrop-filter:none;
      font-size:11px; color:#d6e5f2;
      max-height:none; overflow:visible;
    }
    #bv-side-panel h3{ margin:0 0 4px 0; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#7a8fa8; font-weight:800; }
    #bv-side-panel .bv-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0; }
    #bv-side-panel .bv-row b{ color:#fff; font-weight:700; }
    #bv-moon-svg{ width:100%; height:auto; max-width:200px; align-self:center; }
    #bv-tide-svg{ width:100%; height:80px; }
    .dot-temp { background: #ff8c00; }
    .dot-wave { background: #00c8ff; }
    .dot-swell { background: #8bd7ff; }
    .dot-composite { background: #ffb3d1; box-shadow: 0 0 0 1px #000 inset; }
    .dot-wind { background: #62e58a; }
    .dot-press { background: #c59bff; }

    .bv-framebar {
      position: fixed; bottom: 56px; left: 0; right: 0; z-index: 15;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 14px; background: rgba(5, 11, 16, 0.95);
      border-top: 1px solid #1b2836;
    }
    .bv-framebar button {
      background: #1b2836; color: #b3e5fc; border: 1px solid #2a3a4d;
      width: 32px; height: 32px; border-radius: 4px; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .bv-framebar button:hover { background: #2a3a4d; }
    .bv-framebar button.playing { background: #4fc3f7; color: #050b10; border-color: #4fc3f7; }
    #bv-slider { flex: 1; min-width: 100px; accent-color: #4fc3f7; height: 6px; }
    .bv-frame-label { font-size: 12px; color: #e3f2fd; font-family: monospace; min-width: 140px; text-align: right; }

    .bv-ranges {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 14;
      background: rgba(5, 11, 16, 0.95);
      border-top: 1px solid #1b2836;
      padding: 8px 14px 10px;
      pointer-events: none;
    }
    .bv-ranges-title { font-size: 11px; color: #9fb0c3; font-family: monospace; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bv-ranges-title b { color: #e3f2fd; font-weight: 600; }
    #bv-cbar { width: 100%; height: 32px; }
    .bv-ranges-ticks { display: flex; justify-content: space-between; font-size: 10px; color: #9fb0c3; font-family: monospace; margin-top: 2px; }

    .bv-map { position: absolute; top: 48px; left: 0; right: 0; bottom: 110px; touch-action: none; }
    .bv-flow-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; mix-blend-mode: screen; }
    .bv-streamlines-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .bv-tide-overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; mix-blend-mode: normal; }
    #bv-map > canvas.bv-tide-overlay-canvas { position: absolute !important; inset: 0 !important; z-index: 6 !important; pointer-events: none !important; }

    .ol-attribution { color: #6b7d92 !important; background: rgba(5, 11, 16, 0.8) !important; font-size: 10px !important; pointer-events: none; }
    .ol-control button { background-color: rgba(5, 11, 16, 0.8) !important; color: #b3e5fc !important; }
    .ol-zoom { top: auto; bottom: auto; right: 0.5em; left: auto; }
    .ol-scale-line { pointer-events: none; }

    @media (max-width: 640px) {
      .bv-toolbar { padding: 6px 8px; gap: 6px; }
      .bv-back { font-size: 11px; padding: 3px 6px; }
      .bv-title { font-size: 13px; }
      .bv-time { display: none; }
      .bv-products button { font-size: 11px; padding: 3px 6px; }
      .bv-map { bottom: 96px; }
      .bv-frame-label { min-width: auto; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="bv-toolbar">
    <a class="bv-back" href="javascript:history.back()">← Back</a>
    <div>
      <h1 class="bv-title">Briefing Viewer — <span id="bv-region">usec_md</span></h1>
      <div class="bv-time" id="bv-time">7-Day Outlook · loading forecast…</div>
    </div>
    <button id="bv-hamburger-btn" aria-label="Open layer menu">☰</button>
  </div>
    <div id="bv-menu-panel" aria-label="Layer and briefing menu">
    <div class="bv-section">
      <div class="bv-section-title">Map Layers</div>
      <div class="bv-layers" id="bv-layers">
        <label><input type="checkbox" data-layer="wave_height" checked><span class="bv-dot dot-wave"></span>Significant Wave Height</label>
        <label><input type="checkbox" data-layer="temperature"><span class="bv-dot dot-temp"></span>Temp</label>
        <label><input type="checkbox" data-layer="pressure"><span class="bv-dot dot-press"></span>Pressure</label>
        <label><input type="checkbox" data-layer="tide_phase" checked><span class="bv-dot dot-tide"></span>Co-tidal phase</label>
        <label><input type="checkbox" data-layer="tide_range" checked><span class="bv-dot dot-tide"></span>Co-range amplitude (static)</label>
        <label><input type="checkbox" data-layer="wind" checked><span class="bv-dot dot-wind"></span>Wind</label>
        <label><input type="checkbox" data-layer="wind_wave" checked><span class="bv-dot dot-composite"></span>Wind-Wave</label>
        <label><input type="checkbox" data-layer="swell" checked><span class="bv-dot dot-swell"></span>Swell</label>
      </div>
    </div>
    <div class="bv-status" id="bv-menu-status">Loading…</div>
    <div id="bv-side-panel" aria-label="Tide and moon briefing">
    <div class="bv-section">
      <h3>Moon</h3>
      <svg id="bv-moon-svg" viewBox="0 0 200 110" role="img" aria-label="Moon phase visualization"></svg>
      <div class="bv-row"><span>Phase</span><b id="bv-moon-phase">—</b></div>
      <div class="bv-row"><span>Illumination</span><b id="bv-moon-illum">—</b></div>
      <div class="bv-row"><span>Rise / Set</span><b id="bv-moon-rise-set">—</b></div>
    </div>
    <div class="bv-section">
      <h3>Tide <select id="bv-tide-station" style="font-size:10px;background:#0c1723;color:#b3e5fc;border:1px solid #273649;border-radius:4px;padding:1px 4px;margin-left:4px;"></select></h3>
      <div class="bv-briefing-source" id="bv-tide-source">CO-OPS harmonic prediction · MLLW datum</div>
      <svg id="bv-tide-svg" viewBox="0 0 280 80" role="img" aria-label="24-hour tide curve"></svg>
      <div class="bv-row"><span>Next event</span><b id="bv-tide-next">—</b></div>
      <div class="bv-row"><span>Range</span><b id="bv-tide-range">—</b></div>
    </div>
    <div class="bv-section">
      <h3>Sun</h3>
      <div class="bv-row"><span>Sunrise</span><b id="bv-sun-rise">—</b></div>
      <div class="bv-row"><span>Sunset</span><b id="bv-sun-set">—</b></div>
    </div>
    </div>
  </div>

  <div id="bv-map" class="bv-map"></div>

  <div class="bv-framebar">
    <button id="bv-prev" aria-label="Previous frame">‹</button>
    <button id="bv-play" aria-label="Play">▶</button>
    <input id="bv-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Frame">
    <button id="bv-next" aria-label="Next frame">›</button>
    <span class="bv-frame-label" id="bv-frame-label">—</span>
  </div>

  <div class="bv-ranges">
    <div class="bv-ranges-title">
      <b id="bv-cbar-name">Temperature</b>
      <span id="bv-cbar-unit">°F</span>
    </div>
    <canvas id="bv-cbar" width="1000" height="32"></canvas>
    <div class="bv-ranges-ticks" id="bv-cbar-ticks"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
  <script>
  (function () {
    'use strict';

    // ---- params / region ----
    const params = new URLSearchParams(window.location.search);
    // Default to the current UTC hour so newly published forecast frames
    // are visible immediately; a ?date=YYYY-MM-DD query still selects a day.
    const targetDate = params.get('date') || new Date().toISOString().slice(0, 13);
    const region = params.get('region') || 'usec_md';
    document.getElementById('bv-region').textContent = region;

    const BBOXES = {
      usec_md:    [-77.0, 36.0, -72.0, 40.0],
      usec_south: [-81.0, 31.0, -73.0, 36.0],
    };
    const bbox = BBOXES[region] || BBOXES.usec_md;

    // ---- data (declared before any function references it; fixes TDZ in
    // TIDE_STATIONS initializer and renderActiveTide). ----
    let forecastData = null; // { bbox, frame_interval_hours, frames, lons, lats, tides }
    let frameIdx = 0;
    let playTimer = null;
    let fieldBbox = bbox;
    const rasterProjection = 'EPSG:4326';

    // ---- product definitions (mirrors captain's dashboard scale choices) ----
    // Inspired by captain's dashboard scales (CHL_ALGAE, SST_SCALE, UV_SCALE,
    // SLA_SCALE, BATHY_SCALE) in dashboard/index.html. Each product uses a
    // perceptually-uniform 7-stop gradient; user_ranges set the [vmin, vmax].
    // Per-variable viz pattern (Mike #34568: "plot each data variable based on its characteristics"):
    //  - heat      -> bilinear raster tile as a heat map
    //  - arrows    -> heat + vector arrows on top (uses *_direction_deg)
    //  - streamlines -> Euler-integrated streamlines over the (u,v) field, no heat fill
    //  - contours  -> marching-squares isobars (for pressure)
    //  - dynamicRange=true recomputes [vmin, vmax] from the actual frame data
    //    so the colorbar isn't clipped when the data sits outside the default range.
    const PRODUCTS = {
      temperature_f: { name: 'Air temperature', unit: '°F', scale: 'SST', viz: 'heat', dataKey: 'temperature_f', dynamicRange: true },
      wave_height_ft:{ name: 'Significant wave height', unit: 'ft', scale: 'UV', viz: 'arrows', dataKey: 'wave_height_ft', dirKey: 'wave_direction_deg', dynamicRange: true },
      swell_height_ft:{name: 'Swell height',unit: 'ft', scale: 'UV', viz: 'arrows', dataKey: 'swell_height_ft', dirKey: 'swell_direction_deg', dynamicRange: true },
      // Composite heat uses significant wave height; partition directions are
      // rendered as the swell and wind-wave overlays below.
      wave_composite:{name: 'Significant wave height', unit: 'ft', scale: 'UV', viz: 'composite', dataKey: 'wave_height_ft', dynamicRange: true },
      wind_speed_kn: { name: 'Wind flow',   unit: 'kn',  scale: 'CHL', viz: 'streamlines', dynamicRange: false },
      pressure_hpa:  { name: 'Pressure',    unit: 'hPa', scale: 'SLA', viz: 'contours',    dynamicRange: true  },
    };

    // viridis-like 7-stop palette (matches captain's UV_SCALE / CHL_ALGAE feel)
    const SCALES = {
      SST: [[0.0,'#2166ac'],[0.18,'#4393c3'],[0.36,'#92c5de'],[0.5,'#f7f7f7'],[0.64,'#fddbc7'],[0.82,'#f4a582'],[1.0,'#b2182b']],
      UV:  [[0.0,'#440154'],[0.17,'#443983'],[0.34,'#31688e'],[0.5,'#35b779'],[0.67,'#90d743'],[0.83,'#fde725'],[1.0,'#fff7bc']],
      CHL: [[0.0,'#001f3f'],[0.2,'#0074d9'],[0.4,'#39cccc'],[0.5,'#2ecc40'],[0.7,'#ffdc00'],[0.85,'#ff851b'],[1.0,'#ff4136']],
      SLA: [[0.0,'#2166ac'],[0.25,'#67a9cf'],[0.5,'#f7f7f7'],[0.75,'#ef8a62'],[1.0,'#b2182b']],
      // Offshore water-level contrast: low/negative values stay pale blue;
      // higher positive values move through royal blue into purple. Tide
      // values use a signed-log transform below so small offshore changes
      // remain visible without saturating the shelf signal.
      TIDE:[[0.0,'#d9f3ff'],[0.18,'#8ed8f8'],[0.38,'#2f8fce'],[0.58,'#1554b7'],[0.78,'#32258f'],[1.0,'#7b2cbf']],
    };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexToRgb(hex) {
      const m = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
      return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [255,255,255];
    }
    function rgbToHex(r,g,b) {
      const h = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0');
      return '#' + h(r) + h(g) + h(b);
    }
    function sampleScale(scale, t) {
      const stops = SCALES[scale] || SCALES.SST;
      for (let i = 0; i < stops.length - 1; i++) {
        if (t <= stops[i+1][0]) {
          const u = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
          const c0 = hexToRgb(stops[i][1]);
          const c1 = hexToRgb(stops[i+1][1]);
          return rgbToHex(lerp(c0[0], c1[0], u), lerp(c0[1], c1[1], u), lerp(c0[2], c1[2], u));
        }
      }
      return stops[stops.length-1][1];
    }

    function tideLogValue(v) {
      // Signed logarithm preserves the zero crossing required for water level
      // while expanding the low-amplitude offshore signal.
      const scale = 0.25;
      return Math.sign(v) * Math.log1p(Math.abs(v) / scale);
    }

    function scalarNorm(v, vmin, vmax, scale) {
      if (scale !== 'TIDE') return (v - vmin) / (vmax - vmin || 1);
      const lo = tideLogValue(vmin), hi = tideLogValue(vmax);
      return (tideLogValue(v) - lo) / (hi - lo || 1);
    }

    // ---- hamburger + side-panel briefing (tide / moon / sun) ----
    // Toggles the floating layer menu (matches dashboard/index.html
    // #hamburger-btn + #menu-panel behavior) so the briefing viewer feels
    // native to FishEdge. The side panel renders tide curves, moon phase,
    // and sunrise/sunset without competing with the map.
    function setupHamburger() {
      const btn = document.getElementById('bv-hamburger-btn');
      const panel = document.getElementById('bv-menu-panel');
      if (!btn || !panel) return;
      const closeMenu = () => panel.classList.remove('open');
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        panel.classList.toggle('open');
      });
      document.addEventListener('click', (ev) => {
        if (!panel.contains(ev.target) && ev.target !== btn) closeMenu();
      });
      // ESC closes the menu (keyboard accessibility).
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') closeMenu();
      });
    }

    // ---- sun + moon (pure-math, no API dependency) ----
    // Sun: NOAA solar calculator. Moon: standard synodic-age formula.
    // Both are first-class captains' inputs and cost ~10 LOC each, so they
    // ship in the viewer rather than the pipeline.
    const SYNODIC_DAYS = 29.530588853;
    const KNOWN_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14); // 2000-01-06 18:14 UTC

    function moonPhase(date) {
      const age = ((date.getTime() - KNOWN_NEW_MOON) / 86400000) % SYNODIC_DAYS;
      const a = age < 0 ? age + SYNODIC_DAYS : age;
      // phase in [0,1); 0=new, 0.25=first quarter, 0.5=full, 0.75=last quarter
      const phase = a / SYNODIC_DAYS;
      const illum = (1 - Math.cos(2 * Math.PI * phase)) / 2; // 0..1
      let name;
      if (phase < 0.03 || phase > 0.97) name = 'New';
      else if (phase < 0.22) name = 'Waxing crescent';
      else if (phase < 0.28) name = 'First quarter';
      else if (phase < 0.47) name = 'Waxing gibbous';
      else if (phase < 0.53) name = 'Full';
      else if (phase < 0.72) name = 'Waning gibbous';
      else if (phase < 0.78) name = 'Last quarter';
      else name = 'Waning crescent';
      return { age: a, phase, illum, name };
    }

    function sunTimes(date, lat, lon) {
      // NOAA solar position algorithm (simplified, accuracy ±1 minute).
      const rad = Math.PI / 180;
      const dayOfYear = Math.floor((date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000);
      const decl = 23.45 * rad * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);
      const lat0 = lat * rad;
      const cosH = -Math.tan(lat0) * Math.tan(decl);
      if (cosH > 1 || cosH < -1) return { sunrise: null, sunset: null, polar: true };
      const H = Math.acos(cosH) / rad; // hour angle in degrees
      const eqTime = 0; // simple model — within ±10 min, acceptable for UI
      const solarNoon = 12 - lon / 15 - eqTime / 60;
      const sunrise = solarNoon - H / 15;
      const sunset = solarNoon + H / 15;
      return { sunrise, sunset, polar: false };
    }

    function fmtClock(hours) {
      if (hours == null || !isFinite(hours)) return '—';
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      const hh = ((h % 24) + 24) % 24;
      const mm = (m + 60) % 60;
      const ampm = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh === 0 ? 12 : (hh > 12 ? hh - 12 : hh);
      return `${h12}:${String(mm).padStart(2,'0')} ${ampm}`;
    }

    function renderMoonSvg(date, m) {
      const svg = document.getElementById('bv-moon-svg');
      if (!svg) return;
      const W = 200, H = 110, cx = 70, cy = 55, R = 38;
      const phase = m.phase; // 0..1
      // The illuminated limb travels across the disk; we draw two semicircles
      // (dark + lit) and an ellipse terminator that bulges left or right.
      const isWaxing = phase < 0.5;
      // terminator x-radius: 0 at new/full, R at quarters
      const tx = R * Math.abs(1 - 2 * phase); // sign by phase position
      const dir = isWaxing ? 1 : -1;
      // Dark disk: full circle as background
      const illum = m.illum;
      const lit = (isWaxing ? phase * 2 : (1 - phase) * 2); // 0..1 across half cycle
      // Lit half: full half-circle from terminator outward
      const litPath = (() => {
        // lit area = (lit half-circle on the lit side) + (ellipse half on lit side)
        const side = isWaxing ? 1 : -1; // lit is right when waxing, left when waning
        const rx = R * Math.abs(Math.cos(Math.PI * lit));
        // arc from top to bottom along the outer limb on the lit side
        const sweepOuter = isWaxing ? 0 : 1;
        // inner arc along the ellipse terminator
        const sweepInner = isWaxing ? 1 : 0;
        return [
          `M ${cx} ${cy - R}`,
          `A ${R} ${R} 0 0 ${sweepOuter} ${cx} ${cy + R}`,
          `A ${rx} ${R} 0 0 ${sweepInner} ${cx} ${cy - R}`,
          'Z',
        ].join(' ');
      })();
      svg.innerHTML = `
        <defs>
          <radialGradient id="bvMoonLit" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff8d6"/>
            <stop offset="60%" stop-color="#e8e0b8"/>
            <stop offset="100%" stop-color="#9c9080"/>
          </radialGradient>
        </defs>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="#1a2230" stroke="#3a4a60" stroke-width="1"/>
        <path d="${litPath}" fill="url(#bvMoonLit)"/>
        <text x="${W - 16}" y="20" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#d6e5f2" font-weight="700">${m.name.toUpperCase()}</text>
        <text x="${W - 16}" y="36" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#9fb0c3">${(illum*100).toFixed(0)}% lit</text>
        <text x="${W - 16}" y="52" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#7a8fa8">age ${m.age.toFixed(1)}d</text>
        <text x="${cx}" y="${H - 8}" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#7a8fa8">next new moon in ${(SYNODIC_DAYS - m.age).toFixed(1)}d</text>
      `;
    }

    function parseForecastDate(value) {
      if (!value) return new Date();
      const raw = String(value);
      // Forecast frames use either YYYY-MM-DD or an ISO timestamp without a
      // timezone. Treat both as UTC and never append a second time component.
      const iso = /^\d{4}-\d{2}-\d{2}$/.test(raw)
        ? `${raw}T12:00:00Z`
        : (/Z$|[+-]\d\d:\d\d$/.test(raw) ? raw : `${raw}Z`);
      const parsed = new Date(iso);
      return Number.isFinite(parsed.getTime()) ? parsed : new Date();
    }

    function renderSunMoon(targetDate) {
      const refDate = parseForecastDate(targetDate);
      const m = moonPhase(refDate);
      // Roughly central to the bbox
      const lat = (bbox[1] + bbox[3]) / 2, lon = (bbox[0] + bbox[2]) / 2;
      const s = sunTimes(refDate, lat, lon);
      renderMoonSvg(refDate, m);
      const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      set('bv-moon-phase', m.name);
      set('bv-moon-illum', `${(m.illum * 100).toFixed(0)}%`);
      set('bv-moon-rise-set', `${(m.age).toFixed(1)}d synodic · ${((1 - m.age / SYNODIC_DAYS) * 100).toFixed(0)}% to new`);
      set('bv-sun-rise', s.polar ? 'polar' : fmtClock(s.sunrise));
      set('bv-sun-set', s.polar ? 'polar' : fmtClock(s.sunset));
    }

    // ---- tides (CO-OPS harmonic predictions, rendered when station id present) ----
    // CO-OPS provides free hourly predictions out to ~2 days via the
    // api/data/ txt endpoints. We precompute the request URL on the Python
    // side and ship station metadata + sample curves inline so the viewer
    // can render without a live fetch.
    const TIDE_STATIONS = (forecastData && forecastData.tides && Array.isArray(forecastData.tides.stations))
      ? forecastData.tides.stations
      : [
          { id: '8635750', name: 'Cape May, NJ',     lat: 38.968, lon: -74.960 },
          { id: '8534720', name: 'Atlantic City, NJ',lat: 39.355, lon: -74.418 },
          { id: '8570283', name: 'Ocean City Inlet', lat: 38.328, lon: -75.092 },
          { id: '8638863', name: 'CBBT, Chesapeake', lat: 36.967, lon: -76.117 },
          { id: '8651370', name: 'Duck, NC',         lat: 36.183, lon: -75.747 },
        ];
    let activeTideStation = TIDE_STATIONS[0];

    function renderTideChart(curve, range, nextEvent) {
      const svg = document.getElementById('bv-tide-svg');
      if (!svg) return;
      const W = 280, H = 80, padL = 24, padR = 6, padT = 4, padB = 14;
      const innerW = W - padL - padR, innerH = H - padT - padB;
      if (!curve || !curve.length) {
        svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#7a8fa8" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">tide unavailable</text>`;
        return;
      }
      const t0 = curve[0].t;
      const tN = curve[curve.length-1].t;
      const { vmin, vmax } = range || (() => {
        const vs = curve.map(p => p.v);
        return { vmin: Math.min(...vs), vmax: Math.max(...vs) };
      })();
      const span = Math.max(0.1, vmax - vmin);
      const x = t => padL + ((t - t0) / (tN - t0)) * innerW;
      const y = v => padT + innerH - ((v - vmin) / span) * innerH;
      const pts = curve.map(p => `${x(p.t).toFixed(2)},${y(p.v).toFixed(2)}`).join(' ');
      const fillPath = `M ${x(t0).toFixed(2)} ${(padT+innerH).toFixed(2)} L ${pts.replace(/ /g,' L ')} L ${x(tN).toFixed(2)} ${(padT+innerH).toFixed(2)} Z`;
      const ticks = [];
      for (let h = 0; h <= 24; h += 6) {
        const tt = t0 + h * 3600000;
        if (tt > tN) break;
        ticks.push(`<line x1="${x(tt)}" y1="${padT+innerH}" x2="${x(tt)}" y2="${padT+innerH+3}" stroke="#5a6b7d"/>`);
        ticks.push(`<text x="${x(tt)}" y="${H-2}" text-anchor="middle" font-size="8" fill="#7a8fa8" font-family="ui-monospace,Menlo,Consolas,monospace">+${h}h</text>`);
      }
      const mlwLine = `<line x1="${padL}" y1="${y(0)}" x2="${padL+innerW}" y2="${y(0)}" stroke="#4fc3f7" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.6"/>`;
      const evLabel = nextEvent
        ? `<text x="${padL}" y="${padT+8}" font-size="9" fill="#ffd166" font-family="ui-monospace,Menlo,Consolas,monospace">${nextEvent.label}</text>`
        : '';
      svg.innerHTML = `
        <rect x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="rgba(79,195,247,0.04)" stroke="#273649" stroke-width="0.5"/>
        ${mlwLine}
        <polyline points="${pts}" fill="none" stroke="#4fc3f7" stroke-width="1.4"/>
        <path d="${fillPath}" fill="rgba(79,195,247,0.18)"/>
        ${ticks.join('')}
        ${evLabel}
      `;
      const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      const r = (vmax - vmin);
      set('bv-tide-range', `${r.toFixed(1)} ft`);
      set('bv-tide-next', nextEvent ? nextEvent.label : '—');
    }

    function setupTideStationSelect() {
      const sel = document.getElementById('bv-tide-station');
      if (!sel) return;
      sel.innerHTML = TIDE_STATIONS.map(s =>
        `<option value="${s.id}">${s.name}</option>`
      ).join('');
      sel.value = activeTideStation.id;
      sel.addEventListener('change', () => {
        activeTideStation = TIDE_STATIONS.find(s => s.id === sel.value) || TIDE_STATIONS[0];
        renderActiveTide();
      });
    }

    function renderActiveTide() {
      const tides = (forecastData && forecastData.tides) || null;
      if (!tides || !tides.curves) {
        renderTideChart(null, null, null);
        return;
      }
      const curve = tides.curves[activeTideStation.id];
      const next = (tides.next_event || {})[activeTideStation.id];
      const range = tides.range && tides.range[activeTideStation.id];
      renderTideChart(curve, range, next || null);
    }

    // ---- data ----
    // (forecastData / frameIdx / playTimer declared up top to avoid TDZ when
    // TIDE_STATIONS initializer reads forecastData on script load)

    const FORECAST_URL = `https://data.fishedge.live/${region}/briefing/forecast.json`;
    // Keep the data artifact tied to the deployment that contains it. This
    // also forces the Pages edge to fetch the refreshed 72-frame tide grid
    // instead of reusing an older cached JSON response.
    const FORECAST_DATA_BUILD = 'c58cf058';
    const DEV_FORECAST_URL = `/dashboard/trip-planner/data/${region}/briefing/forecast.json?v=${FORECAST_DATA_BUILD}`;
    const CORS_PROXY = 'https://corsproxy.io/?';
    const MAX_FORECAST_AGE_HOURS = 12;

    async function fetchJson(url) {
      try {
        const r = await fetch(url, { cache: 'no-store', mode: 'cors' });
        if (r.ok) return await r.json();
      } catch (_) {}
      const proxied = CORS_PROXY + encodeURIComponent(url);
      const r = await fetch(proxied, { cache: 'no-store' });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    }

    // Keep old cached artifacts readable, but make every renderer consume the
    // explicit-unit v2 names. Legacy aliases are accepted only at this edge.
    function normalizeForecastPayload(payload) {
      if (!payload || !Array.isArray(payload.frames)) throw new Error('forecast missing frames');
      const aliases = {
        wave_height: 'wave_height_ft', wave_direction: 'wave_direction_deg', wave_period: 'wave_period_s',
        swell_wave_height: 'swell_height_ft', swell_wave_direction: 'swell_direction_deg', swell_wave_period: 'swell_period_s',
        wind_wave_height: 'wind_wave_height_ft', wind_wave_direction: 'wind_wave_direction_deg', wind_wave_period: 'wind_wave_period_s',
      };
      let legacy = false;
      const frames = payload.frames.map(frame => {
        const out = { ...frame };
        for (const [oldKey, newKey] of Object.entries(aliases)) {
          if (out[newKey] == null && out[oldKey] != null) { out[newKey] = out[oldKey]; legacy = true; }
        }
        return out;
      });
      if (legacy) console.warn('[forecast] normalized legacy marine keys', { generated_at: payload.generated_at, source: payload.source });
      return { ...payload, schema_version: payload.schema_version || 'briefing-forecast-v1-legacy', frames };
    }

    // ---- ol setup ----
    const baseLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        // Use the public OSM raster directly. CARTO's hosted style can emit
        // an API-key/watermark response; this path has no Carto dependency.
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        attributions: '© OpenStreetMap contributors',
        maxZoom: 19,
        crossOrigin: 'anonymous',
      }),
      opacity: 0.7,
      zIndex: 0,
    });

    const map = new ol.Map({
      target: 'bv-map',
      layers: [baseLayer],
      view: new ol.View({
        projection: rasterProjection,
        center: [(bbox[0]+bbox[2])/2, (bbox[1]+bbox[3])/2],
        zoom: 5.5,
        minZoom: 4,
        maxZoom: 12,
        extent: [bbox[0]-1, bbox[1]-1, bbox[2]+1, bbox[3]+1],
      }),
      controls: ol.control.defaults.defaults({ attribution: true, rotate: false }).extend([
        new ol.control.ScaleLine(),
      ]),
    });

    // Dev-only domain diagnostics: show the target box and the larger field
    // used by streamline integration once the forecast metadata is loaded.
    const domainSource = new ol.source.Vector();
    const domainLayer = new ol.layer.Vector({
      source: domainSource,
      zIndex: 8,
      style: feature => feature.get('kind') === 'field'
        ? new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(255,193,7,0.9)', width: 2, lineDash: [8, 6] }) })
        : new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(79,195,247,0.95)', width: 2 }) }),
    });
    map.addLayer(domainLayer);
    const devDiagnostics = window.location.hostname.startsWith('feat-');
    function drawDomainDiagnostics() {
      if (!devDiagnostics || !Array.isArray(fieldBbox)) return;
      domainSource.clear();
      const ring = extent => ol.geom.Polygon.fromExtent(extent);
      const fieldFeature = new ol.Feature(ring(fieldBbox));
      fieldFeature.set('kind', 'field');
      const targetFeature = new ol.Feature(ring(bbox));
      targetFeature.set('kind', 'target');
      domainSource.addFeatures([fieldFeature, targetFeature]);
      map.getView().set('extent', fieldBbox);
    }

    // overlays for wind streamlines + animated particles
    const mapEl = document.getElementById('bv-map');
    const streamlineCanvas = document.createElement('canvas');
    streamlineCanvas.className = 'bv-streamlines-canvas';
    streamlineCanvas.setAttribute('aria-hidden', 'true');
    mapEl.appendChild(streamlineCanvas);
    const streamlineCtx = streamlineCanvas.getContext('2d');
    const flowCanvas = document.createElement('canvas');
    flowCanvas.className = 'bv-flow-canvas';
    flowCanvas.setAttribute('aria-hidden', 'true');
    mapEl.appendChild(flowCanvas);
    const flowCtx = flowCanvas.getContext('2d');
    // Keep static tidal contours separate from the animated flow canvas.
    const tideCanvas = document.createElement('canvas');
    tideCanvas.className = 'bv-tide-overlay-canvas';
    tideCanvas.setAttribute('aria-hidden', 'true');
    mapEl.appendChild(tideCanvas);
    const tideCtx = tideCanvas.getContext('2d');

    // client-rendered raster layer (replaces old PNG ImageStatic)
    const rasterLayer = new ol.layer.Image({
      source: new ol.source.ImageCanvas({
        projection: rasterProjection,
        extent: bbox,
        ratio: 1,
        interpolate: true,
        canvasFunction: (requestedExtent, resolution, pixelRatio, size) => {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.ceil(size[0]));
          c.height = Math.max(1, Math.ceil(size[1]));
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          if (!forecastData || !currentFrame || !hasVisibleRasterVariable()) return c;
          // Mike #34665: 'when I zoom in there is a color layer, which is
          // unknown.' For viz='streamlines' and viz='contours' we DO NOT want
          // a heat-map fill under the vector overlay — the streamlines/isobars
          // carry the visual signal. Skip drawFrameToTile so the raster layer
          // is transparent for those products.
          const viz = (PRODUCTS[currentProduct] || {}).viz;
          if (viz === 'streamlines' || viz === 'contours') return c;
          drawFrameToTile(ctx, currentFrame, currentProduct, requestedExtent, c.width, c.height);
          return c;
        },
      }),
      opacity: 0.85,
      zIndex: 5,
    });
    map.addLayer(rasterLayer);

    // ---- state ----
    // The viewer is intentionally a single composite map.  The checkboxes
    // control overlays and the selected scalar background.
    let currentProduct = 'wave_composite';
    let currentFrame = null;
    let activeRange = null; // {vmin, vmax} computed per-frame when dynamicRange=true
    const layerVisibility = { wave_height: true, temperature: false, pressure: false, tide_phase: true, tide_range: true, swell: true, wind_wave: true, wind: true };
    const particles = [];

    function hasVisibleRasterVariable() {
      // The composite raster is the scalar heat field. Directional variables
      // are drawn on transparent canvases, so they must never keep the raster
      // alive after the scalar checkboxes are cleared.
      return !!(layerVisibility.wave_height || layerVisibility.temperature || layerVisibility.pressure);
    }

    function activeHeatKey() {
      if (layerVisibility.temperature) return 'temperature_f';
      if (layerVisibility.wave_height) return 'wave_height_ft';
      if (layerVisibility.pressure) return 'pressure_hpa';
      return null;
    }

    function parseForecastTime(value) {
      const raw = String(value || '').trim();
      if (!raw) return NaN;
      if (/^\d{4}-\d\d-\d\d$/.test(raw)) return Date.parse(raw + 'T12:00:00Z');
      if (/^\d{4}-\d\d-\d\dT\d\d$/.test(raw)) return Date.parse(raw + ':00:00Z');
      return Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(raw) ? raw : raw + 'Z');
    }

    function nearestFrameIdxToDate(frames, wantedDate) {
      if (!frames || !frames.length) return 0;
      const wantedMs = parseForecastTime(wantedDate);
      let bestI = 0, bestDist = Infinity;
      for (let i = 0; i < frames.length; i++) {
        const dist = Math.abs(parseForecastTime(frames[i].time) - wantedMs);
        if (dist < bestDist) { bestDist = dist; bestI = i; }
      }
      return bestI;
    }

    // ---- raster tile rendering (interpolates grid bilinearly into the tile extent) ----
    function drawFrameToTile(ctx, frame, productKey, requestedExtent, w, h) {
      const def = PRODUCTS[productKey];
      const dataKey = productKey === 'wave_composite' ? (activeHeatKey() || def.dataKey) : (def.dataKey || productKey);
      const rasterDef = PRODUCTS[dataKey] || def;
      const grid = frame[dataKey];
      if (!grid || !grid.length || !grid[0].length) return;
      const lons = forecastData.lons, lats = forecastData.lats;
      if (!lons || !lats || lons.length < 2 || lats.length < 2) return;
      // dynamic per-frame range — fall back to (0, 30) if activeRange not yet computed.
      // (Bug fix #0f6434f4: PRODUCTS no longer carries vmin/vmax on each entry;
      // drawFrameToTile was reading undefined and rasterizing NaN pixels.)
      const r = activeRange || { vmin: 0, vmax: 30 };
      const vmin = r.vmin, vmax = r.vmax;
      const scale = rasterDef.scale;

      // The map uses EPSG:4326, so ImageCanvas' requested extent is already
      // in the same lon/lat units as the forecast grid.
      const toX = lon => ((lon - requestedExtent[0]) / (requestedExtent[2] - requestedExtent[0])) * w;
      const toY = lat => ((requestedExtent[3] - lat) / (requestedExtent[3] - requestedExtent[1])) * h;

      const nx = lons.length, ny = lats.length;
      const dlon = (lons[nx-1] - lons[0]) / (nx - 1);
      const dlat = (lats[ny-1] - lats[0]) / (ny - 1);

      // bilinear sample of grid at lon,lat
      const sample = (lon, lat) => {
        if (lon < lons[0] || lon > lons[nx-1] || lat < lats[0] || lat > lats[ny-1]) return null;
        const xf = (lon - lons[0]) / dlon;
        const yf = (lat - lats[0]) / dlat;
        const x0 = Math.max(0, Math.min(nx-2, Math.floor(xf)));
        const y0 = Math.max(0, Math.min(ny-2, Math.floor(yf)));
        const x1 = x0 + 1, y1 = y0 + 1;
        const tx = xf - x0, ty = yf - y0;
        const g = grid;
        const a = g[y0]?.[x0], b = g[y0]?.[x1], c = g[y1]?.[x0], d = g[y1]?.[x1];
        if (a == null || b == null || c == null || d == null) return null;
        return a*(1-tx)*(1-ty) + b*tx*(1-ty) + c*(1-tx)*ty + d*tx*ty;
      };

      // Fill the tile by walking the source grid lattice (fast path):
      // for each grid cell, draw a quad with linear color interpolation per row.
      const cellW = Math.abs(toX(lons[1]) - toX(lons[0]));
      const cellH = Math.abs(toY(lats[1]) - toY(lats[0]));
      // quad per cell
      for (let yi = 0; yi < ny - 1; yi++) {
        for (let xi = 0; xi < nx - 1; xi++) {
          if (!forecastData.tide_water_cells?.[yi]?.[xi]) continue;
          const v00 = grid[yi][xi];
          const v10 = grid[yi][xi+1];
          const v01 = grid[yi+1][xi];
          const v11 = grid[yi+1][xi+1];
          if (v00 == null || v10 == null || v01 == null || v11 == null) continue;
          const px = toX(lons[xi]);
          const py = toY(lats[yi]);
          const npx = toX(lons[xi+1]);
          const npy = toY(lats[yi+1]);
          const wpx = npx - px;
          const hpx = py - npy;

          // Bilinear sample four corners and rasterize quad by scanlines
          // (fast enough for 17×21 grid, gives smooth gradient between cells).
          const minX = Math.max(0, Math.floor(px));
          const maxX = Math.min(w, Math.ceil(px + wpx));
          const minY = Math.max(0, Math.floor(npy));
          const maxY = Math.min(h, Math.ceil(py));
          if (maxX <= minX || maxY <= minY) continue;

          const yDir = py > npy ? 1 : -1; // pixel y goes down, lat y goes up
          for (let yy = minY; yy < maxY; yy++) {
            // tY: 0 at top of cell, 1 at bottom
            const tY = yDir > 0 ? (py - yy) / hpx : (yy - npy) / hpx;
            const ttY = Math.max(0, Math.min(1, tY));
            const vTop = v00*(1-ttY) + v01*ttY;
            const vBot = v10*(1-ttY) + v11*ttY;
            const rowImg = ctx.createImageData(maxX - minX, 1);
            const rowData = rowImg.data;
            for (let xx = minX; xx < maxX; xx++) {
              const tX = (xx - px) / wpx;
              const ttX = Math.max(0, Math.min(1, tX));
              const v = vTop*(1-ttX) + vBot*ttX;
              const tNorm = Math.max(0, Math.min(1, scalarNorm(v, vmin, vmax, scale)));
              const hex = sampleScale(scale, tNorm);
              const [r,g,b] = hexToRgb(hex);
              const o = (xx - minX) * 4;
              rowData[o]   = r;
              rowData[o+1] = g;
              rowData[o+2] = b;
              rowData[o+3] = 255;
            }
            ctx.putImageData(rowImg, minX, yy);
          }
        }
      }
    }

    // ---- colorbar ----
    function computeActiveRange() {
      const scalarKey = activeHeatKey() || (layerVisibility.pressure ? 'pressure_hpa' : null);
      const def = PRODUCTS[scalarKey || currentProduct];
      const grid = currentFrame && scalarKey ? currentFrame[scalarKey] : null;
      if (!def.dynamicRange || !grid || !grid.length) {
        activeRange = { vmin: 0, vmax: 30 };
        return;
      }
      const flat = [];
      for (let yi = 0; yi < grid.length; yi++) {
        for (let xi = 0; xi < grid[yi].length; xi++) {
          const v = grid[yi][xi];
          if (v != null && Number.isFinite(v)) flat.push(v);
        }
      }
      if (!flat.length) { activeRange = { vmin: 0, vmax: 30 }; return; }
      let vmin = Math.min(...flat);
      let vmax = Math.max(...flat);
      // pad by 5% on each side so the colorbar isn't pinned to extremes
      const pad = (vmax - vmin) * 0.05 || Math.max(1, Math.abs(vmax) * 0.05);
      vmin -= pad; vmax += pad;
      // Use the padded raw range directly. drawColorbar already produces 5
      // evenly-spaced ticks across [vmin, vmax] with decimals based on span
      // size (decimals=0 for span>=50, 1 for >=5, 2 for tighter). Previously
      // I tried rounding to nice numbers but nice() collapsed pressure data
      // (~981..1017) to vmin=vmax=1000 because Math.log10 of values near a
      // 10^k boundary gives the wrong step. Raw range with linear ticks
      // is correct.
      activeRange = { vmin, vmax };
    }

    function drawColorbar() {
      const scalarKey = activeHeatKey() || (layerVisibility.pressure ? 'pressure_hpa' : null);
      const def = PRODUCTS[scalarKey || currentProduct];
      const r = activeRange || { vmin: 0, vmax: 30 };
      const canvas = document.getElementById('bv-cbar');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      for (let x = 0; x < W; x++) {
        const t = x / (W - 1);
        ctx.fillStyle = sampleScale(def.scale, t);
        ctx.fillRect(x, 0, 1, H - 8);
      }
      const ticks = document.getElementById('bv-cbar-ticks');
      ticks.innerHTML = '';
      const N = 5;
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        const v = r.vmin + (r.vmax - r.vmin) * t;
        const tick = document.createElement('span');
        const decimals = (r.vmax - r.vmin) > 50 ? 0 : (r.vmax - r.vmin) > 5 ? 1 : 2;
        tick.textContent = v.toFixed(decimals);
        ticks.appendChild(tick);
      }
      document.getElementById('bv-cbar-name').textContent = def.name;
      document.getElementById('bv-cbar-unit').textContent = def.unit;
    }

    function primaryDataKey() {
      const scalarKey = layerVisibility.temperature ? 'temperature_f' : layerVisibility.wave_height ? 'wave_height_ft' : null;
      const def = PRODUCTS[scalarKey || currentProduct];
      // map product key -> forecast.json grid key
      return def.dataKey || currentProduct;
    }

    // ---- frame rendering ----
    function setFrame(i) {
      if (!forecastData) return;
      const frames = forecastData.frames;
      frameIdx = Math.max(0, Math.min(frames.length - 1, i));
      currentFrame = frames[frameIdx];
      renderSunMoon(currentFrame && (currentFrame.valid_time || currentFrame.time));
      updateLayerAvailability();
      document.getElementById('bv-slider').value = String(frameIdx);
      const t = currentFrame.time || '—';
      const d = new Date(/[zZ]|[+-]\d\d:\d\d$/.test(t) ? t : t + 'Z');
      const lbl = d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
      document.getElementById('bv-frame-label').textContent = lbl + ' ET';
      computeActiveRange();
      drawColorbar();
      map.render();
      drawOverlaysForProduct();
    }

    function updateLayerAvailability() {
      const available = {
        wave_height: !!(currentFrame && currentFrame.wave_height_ft),
        temperature: !!(currentFrame && currentFrame.temperature_f),
        pressure: !!(currentFrame && currentFrame.pressure_hpa),
        tide_phase: !!(currentFrame && currentFrame.tide_phase_deg),
        tide_range: !!(currentFrame && currentFrame.tide_amplitude_ft),
        wind: !!(currentFrame && currentFrame.wind_speed_kn && currentFrame.wind_direction_deg),
        wind_wave: !!(currentFrame && currentFrame.wind_wave_height_ft && currentFrame.wind_wave_direction_deg),
        swell: !!(currentFrame && currentFrame.swell_height_ft && currentFrame.swell_direction_deg),
      };
      for (const key of Object.keys(available)) {
        const input = document.querySelector(`#bv-layers input[data-layer="${key}"]`);
        const label = input?.closest('label');
        if (!input || !label) continue;
        const anyFrameAvailable = ['tide_phase', 'tide_range'].includes(key) && forecastData && forecastData.frames
          ? forecastData.frames.some(frame => key === 'tide_phase'
              ? !!(frame && frame.tide_phase_deg)
              : !!(frame && frame.tide_amplitude_ft))
          : available[key];
        // Keep the co-line controls interactive even before the atlas
        // artifact arrives.  A disabled checkbox looks broken and hides the
        // real state (the source is simply unavailable, not unchecked).
        const awaitingHtp = ['tide_phase', 'tide_range'].includes(key) && !anyFrameAvailable;
        input.disabled = !anyFrameAvailable && !awaitingHtp;
        // Preserve an enabled layer's checked state while the time slider
        // crosses a frame without a static atlas field.
        if (!anyFrameAvailable && !awaitingHtp) { input.checked = false; layerVisibility[key] = false; }
        else if (['tide_phase', 'tide_range'].includes(key)) input.checked = layerVisibility[key];
        label.classList.toggle('unavailable', !available[key]);
        label.title = available[key] ? '' : (awaitingHtp ? 'Waiting for NASA GOT4.10c harmonic atlas data' : `No ${key} grid in current forecast frame`);
      }
      const tideStatus = document.getElementById('bv-menu-status');
      if (tideStatus && (!available.tide_phase || !available.tide_range)) {
        tideStatus.textContent = 'Co-lines awaiting NASA GOT4.10c harmonic atlas data';
      }
      if (available.wave_height && !layerVisibility.temperature && !layerVisibility.wave_height && !layerVisibility.pressure) {
        // no forced fallback: the user may intentionally turn all scalar layers off
      }
    }

    function clearOverlays() {
      [streamlineCtx, flowCtx, tideCtx].forEach(ctx => ctx && ctx.setTransform(1, 0, 0, 1, 0, 0));
      streamlineCtx && streamlineCtx.clearRect(0, 0, streamlineCanvas.width, streamlineCanvas.height);
      flowCtx && flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      tideCtx && tideCtx.clearRect(0, 0, tideCanvas.width, tideCanvas.height);
    }

    function drawOverlaysForProduct() {
      clearOverlays();
      const def = PRODUCTS[currentProduct];
      // Mike #34713: 'doubling' effect on coastlines was caused by the
      // rasterLayer still being in the layer stack at opacity 0.85 even
      // when drawFrameToTile returned early. Hide the layer entirely
      // when streamlines or contours are showing — they carry the viz,
      // and the raster can produce subtle doubling with the basemap.
      if (rasterLayer) {
        rasterLayer.setVisible(
          (def.viz === 'heat' || def.viz === 'arrows' || def.viz === 'composite') &&
          hasVisibleRasterVariable()
        );
        // setProduct calls map.render() before this visibility switch; render
        // again so the newly enabled composite heat layer is painted now.
        map.render();
      }
      if (def.viz === 'streamlines') {
        drawStreamlines();
        // Particles use the same weak-wind guard as streamlines. A coastline
        // mask is still a future refinement, but disabling the layer leaves
        // the diagnostic map visibly empty in broad low-wind areas.
        startParticleAnimation();
      } else if (def.viz === 'arrows') drawDirectionArrows();
      else if (def.viz === 'contours') drawIsobars();
      else if (def.viz === 'composite') drawWaveComposite();
      else stopParticleAnimation();
      // Co-tidal and co-range overlays are independent of the selected base
      // product and must be redrawn for every product.
      drawTidalContours();
    }

    function drawTidalContours() {
      if (!currentFrame || !forecastData) return;
      resizeOverlayCanvases();
      const ctx = tideCtx;
      const dpr = tideCanvas.width / Math.max(1, mapEl.clientWidth);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const waterCells = forecastData.tide_water_cells;
      ctx.globalCompositeOperation = 'source-over';
      // Keep the harmonic overlay visually dominant over the animated wave
      // strokes.  The field is only 0.25 degrees, so faint 1px contours get
      // lost against the basemap before they can be read offshore.
      ctx.globalAlpha = 1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const lons = forecastData.lons, lats = forecastData.lats;
      const project = (xi, yi) => map.getPixelFromCoordinate(
        ol.proj.fromLonLat([lons[xi], lats[yi]], rasterProjection)
      );
      const segment = (grid, level, style, width, dashed, circular) => {
        ctx.strokeStyle = style;
        ctx.lineWidth = width;
        ctx.setLineDash(dashed ? [5, 4] : []);
        for (let yi = 0; yi < lats.length - 1; yi++) {
          for (let xi = 0; xi < lons.length - 1; xi++) {
            // The atlas mask is a cell mask, not a point mask. Fail closed:
            // only an explicit wet cell may emit a contour. This prevents a
            // missing/misaligned mask row from ever drawing tide lines over
            // the basemap's land.
            if (!waterCells?.[yi]?.[xi]) continue;
            let v00 = grid[yi]?.[xi], v10 = grid[yi]?.[xi + 1];
            let v01 = grid[yi + 1]?.[xi], v11 = grid[yi + 1]?.[xi + 1];
            if (![v00, v10, v01, v11].every(v => Number.isFinite(v))) continue;
            if (circular) {
              const base = v00;
              const unwrap = v => base + ((((v - base) + 540) % 360) - 180);
              v10 = unwrap(v10); v01 = unwrap(v01); v11 = unwrap(v11);
            }
            let points = [];
            const levels = circular ? [level - 360, level, level + 360] : [level];
            for (const contourLevel of levels) {
              const candidate = [];
            const edge = (a, b, pa, pb) => {
              if ((a < contourLevel) === (b < contourLevel) || a === b) return;
              const t = (contourLevel - a) / (b - a);
              candidate.push([pa[0] + t * (pb[0] - pa[0]), pa[1] + t * (pb[1] - pa[1])]);
            };
            const p00 = project(xi, yi), p10 = project(xi + 1, yi);
            const p01 = project(xi, yi + 1), p11 = project(xi + 1, yi + 1);
            if (!p00 || !p10 || !p01 || !p11) continue;
            edge(v00, v10, p00, p10); edge(v10, v11, p10, p11);
            edge(v01, v11, p01, p11); edge(v00, v01, p00, p01);
              if (candidate.length >= 2) { points = candidate; break; }
            }
            if (points.length >= 2) {
              ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
              ctx.lineTo(points[1][0], points[1][1]); ctx.stroke();
            }
          }
        }
        ctx.setLineDash([]);
      };
      if (layerVisibility.tide_phase && currentFrame.tide_phase_deg) {
        // The offshore phase gradient is modest, so 1° contours can leave
        // most of the open ocean visually empty.  One-degree intervals keep
        // the contours truthful while making the continuous offshore field
        // legible. Phase is cyclic; segment() tests the +/-360 seam.
        const phaseColors = ['#fff176', '#e6ee9c', '#b9f6ca', '#80deea', '#4dd0e1', '#81d4fa', '#90caf9', '#9fa8da', '#b39ddb', '#ce93d8', '#f48fb1', '#ffab91'];
        for (let level = 0; level < 360; level += 0.5) {
          segment(currentFrame.tide_phase_deg, level, phaseColors[Math.floor(level / 15) % phaseColors.length], 1.8, false, true);
        }
      }
      if (layerVisibility.tide_range && currentFrame.tide_amplitude_ft) {
        const values = currentFrame.tide_amplitude_ft.flat().filter(Number.isFinite);
        if (values.length) {
          // Dynamic min/max bins are dominated by shallow coastal outliers
          // and collapse the offshore amplitude contours. Use a stable
          // 0.05-ft interval instead; clipping is naturally handled by the
          // finite grid values and the wet-cell mask.
          const lo = Math.floor(Math.min(...values) / 0.05) * 0.05;
          const hi = Math.ceil(Math.max(...values) / 0.05) * 0.05;
          for (let level = lo + 0.05; level < hi; level += 0.05) {
            segment(currentFrame.tide_amplitude_ft, level, 'rgba(230,245,255,0.95)', 1.8, true, false);
          }
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // Shared coarse ocean mask for all animated overlays. The tide artifact
    // is the only regional field with an authoritative land/ocean mask.
    function isOceanPoint(lon, lat) {
      const mask = forecastData?.tide_water_cells;
      const lons = forecastData?.lons, lats = forecastData?.lats;
      if (!mask || !lons || !lats || lons.length < 2 || lats.length < 2) return false;
      const xi = Math.max(0, Math.min(lons.length - 2, Math.floor((lon - lons[0]) / (lons[1] - lons[0]))));
      const yi = Math.max(0, Math.min(lats.length - 2, Math.floor((lat - lats[0]) / (lats[1] - lats[0]))));
      return mask[yi]?.[xi] === true;
    }

    // ---- wave composite: heat fill + swell streamlines + wind-wave streamlines + wind arrows ----
    // Reference image: significant-wave-height heat fill (UV ramp, dynamicRange),
    // black streamlines traced over the swell field, pink streamlines over the
    // wind-wave field, white arrows for atmospheric 10-m wind.
    function drawWaveComposite() {
      if (!currentFrame || !forecastData) return;
      resizeOverlayCanvases();
      const dpr = flowCanvas.width / mapEl.clientWidth;
      // Both canvases share the same transform; clear them in case prior product
      // left residue on the overlay canvas.
      streamlineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      streamlineCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      // Paint the composite heat directly on the overlay as a fallback for
      // ImageCanvas implementations that do not invalidate after a product
      // switch. This keeps the visual contract deterministic: fill first,
      // then partition streamlines and atmospheric arrows above it.
      if (hasVisibleRasterVariable()) drawWaveHeatOverlay();
      if (layerVisibility.swell || layerVisibility.wind_wave) drawWavePackets();
      if (layerVisibility.pressure) drawIsobars(true);
      if (layerVisibility.wind) {
        drawStreamlines(true);
        startParticleAnimation();
      } else {
        stopParticleAnimation();
      }
      startWavePacketAnimation();
    }

    function drawWaveHeatOverlay() {
      const scalarKey = activeHeatKey();
      const grid = scalarKey && currentFrame[scalarKey];
      const lons = forecastData.lons, lats = forecastData.lats;
      if (!grid || !lons || !lats) return;
      const scale = PRODUCTS[scalarKey]?.scale || 'UV';
      const r = activeRange || { vmin: 0, vmax: scalarKey === 'temperature_f' ? 90 : 6 };
      for (let yi = 0; yi < lats.length - 1; yi++) {
        for (let xi = 0; xi < lons.length - 1; xi++) {
          if (!forecastData.tide_water_cells?.[yi]?.[xi]) continue;
          const vals = [grid[yi]?.[xi], grid[yi]?.[xi + 1], grid[yi + 1]?.[xi], grid[yi + 1]?.[xi + 1]];
          if (vals.some(v => v == null || !Number.isFinite(v))) continue;
          const v = vals.reduce((a, b) => a + b, 0) / vals.length;
          const c = hexToRgb(sampleScale(scale, Math.max(0, Math.min(1, scalarNorm(v, r.vmin, r.vmax, scale)))));
          const p00 = map.getPixelFromCoordinate(ol.proj.fromLonLat([lons[xi], lats[yi]], rasterProjection));
          const p10 = map.getPixelFromCoordinate(ol.proj.fromLonLat([lons[xi + 1], lats[yi]], rasterProjection));
          const p11 = map.getPixelFromCoordinate(ol.proj.fromLonLat([lons[xi + 1], lats[yi + 1]], rasterProjection));
          const p01 = map.getPixelFromCoordinate(ol.proj.fromLonLat([lons[xi], lats[yi + 1]], rasterProjection));
          if (!p00 || !p10 || !p11 || !p01) continue;
          streamlineCtx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.62)`;
          streamlineCtx.beginPath();
          streamlineCtx.moveTo(p00[0], p00[1]); streamlineCtx.lineTo(p10[0], p10[1]);
          streamlineCtx.lineTo(p11[0], p11[1]); streamlineCtx.lineTo(p01[0], p01[1]);
          streamlineCtx.closePath(); streamlineCtx.fill();
        }
      }
    }

    let wavePackets = null;
    let wavePacketRaf = 0;
    let wavePacketLastTs = 0;

    function ensureWavePackets() {
      if (wavePackets) return;
      wavePackets = [];
      for (const kind of ['swell', 'wind_wave']) {
        // Seed the initial visible population through the same source model
        // used for later births; do not paint an unweighted uniform cloud.
        for (let i = 0; i < 90; i++) {
          const packet = { kind, lon: bbox[0], lat: bbox[1], age: Math.random() * 12000 };
          respawnWavePacket(packet);
          wavePackets.push(packet);
        }
      }
    }

    function drawWavePackets() {
      ensureWavePackets();
      const styles = {
        swell: { stroke: 'rgba(0, 0, 0, 0.95)', width: 1.5, half: 0.14, max: 4.0 },
        wind_wave: { stroke: 'rgba(255, 105, 180, 0.92)', width: 1.25, half: 0.105, max: 2.0 },
      };
      for (const packet of wavePackets) {
        if (!layerVisibility[packet.kind]) continue;
        if (!isOceanPoint(packet.lon, packet.lat)) continue;
        const s = styles[packet.kind];
        const vec = bilinearPartitionVec(currentFrame, packet.kind, packet.lon, packet.lat);
        if (!vec || vec.speed < (packet.kind === 'swell' ? 0.4 : 0.15)) continue;
        const c = map.getPixelFromCoordinate(ol.proj.fromLonLat([packet.lon, packet.lat], rasterProjection));
        const inv = 1 / vec.speed;
        const tx = -vec.v * inv, ty = vec.u * inv;
        const cosLat = Math.max(0.35, Math.cos(packet.lat * Math.PI / 180));
        const p0 = map.getPixelFromCoordinate(ol.proj.fromLonLat([
          packet.lon - tx * s.half / cosLat, packet.lat - ty * s.half
        ], rasterProjection));
        const p1 = map.getPixelFromCoordinate(ol.proj.fromLonLat([
          packet.lon + tx * s.half / cosLat, packet.lat + ty * s.half
        ], rasterProjection));
        if (!c || !p0 || !p1) continue;
        streamlineCtx.globalAlpha = 0.48 + 0.42 * Math.min(1, vec.speed / s.max);
        streamlineCtx.strokeStyle = s.stroke;
        streamlineCtx.lineWidth = s.width;
        streamlineCtx.lineCap = 'round';
        streamlineCtx.beginPath();
        streamlineCtx.moveTo(p0[0], p0[1]);
        streamlineCtx.lineTo(p1[0], p1[1]);
        streamlineCtx.stroke();
      }
      streamlineCtx.globalAlpha = 1;
    }

    function startWavePacketAnimation() {
      if (wavePacketRaf) return;
      wavePacketLastTs = 0;
      const tick = ts => {
        wavePacketRaf = 0;
        if (currentProduct !== 'wave_composite' || !currentFrame || !forecastData) return;
        const dt = wavePacketLastTs ? Math.min(50, ts - wavePacketLastTs) : 16;
        wavePacketLastTs = ts;
        ensureWavePackets();
        for (const packet of wavePackets) {
          packet.age += dt;
          const vec = bilinearPartitionVec(currentFrame, packet.kind, packet.lon, packet.lat);
          if (!isOceanPoint(packet.lon, packet.lat) || !vec || vec.speed < (packet.kind === 'swell' ? 0.4 : 0.15)) {
            // Do not leave a packet stranded in a calm/null cell: drawWavePackets
            // intentionally suppresses those marks, so recover it immediately
            // through the appropriate physical source model.
            respawnWavePacket(packet);
            continue;
          }
          const step = (packet.kind === 'swell' ? 0.0045 : 0.0055) * (dt / 16);
          const cosLat = Math.max(0.35, Math.cos(packet.lat * Math.PI / 180));
          packet.lon += (vec.u / vec.speed) * step / cosLat;
          packet.lat += (vec.v / vec.speed) * step;
          // Continuously inject a new packet at the upstream boundary. The
          // age limit staggers births even when a weak/turning field keeps a
          // packet inside the display for a long time.
          if (packet.age > 12000 || packet.lon < bbox[0] || packet.lon > bbox[2] ||
              packet.lat < bbox[1] || packet.lat > bbox[3]) respawnWavePacket(packet);
        }
        // The wind particle animator owns flowCtx and its trail decay.  The
        // wave animator must clear only the streamline canvas, otherwise it
        // erases every wind particle immediately after it is drawn.
        streamlineCtx.clearRect(0, 0, streamlineCanvas.width, streamlineCanvas.height);
        resizeOverlayCanvases();
        const dpr = flowCanvas.width / mapEl.clientWidth;
        streamlineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawWaveHeatOverlay();
        if (layerVisibility.swell || layerVisibility.wind_wave) drawWavePackets();
        if (layerVisibility.pressure) drawIsobars(true);
        if (layerVisibility.wind) drawStreamlines(true);
        wavePacketRaf = requestAnimationFrame(tick);
      };
      wavePacketRaf = requestAnimationFrame(tick);
    }

    function respawnWavePacket(packet) {
      const spanLon = bbox[2] - bbox[0], spanLat = bbox[3] - bbox[1];
      const edgeCandidates = Array.from({ length: 32 }, (_, i) => {
        const t = (i + Math.random()) / 32;
        const side = i % 4;
        return side === 0 ? [bbox[0], bbox[1] + t * spanLat]
          : side === 1 ? [bbox[2], bbox[1] + t * spanLat]
          : side === 2 ? [bbox[0] + t * spanLon, bbox[1]]
          : [bbox[0] + t * spanLon, bbox[3]];
      });
      // Swell is remotely generated and enters from a boundary. Wind waves
      // are locally forced, so most new wind-wave packets originate in the
      // interior where the wind-wave field has energy, with a small boundary
      // component retained for continuity.
      const interiorCandidates = Array.from({ length: 24 }, () => [
        bbox[0] + (0.05 + 0.9 * Math.random()) * spanLon,
        bbox[1] + (0.05 + 0.9 * Math.random()) * spanLat,
      ]);
      const candidates = packet.kind === 'swell'
        ? edgeCandidates
        : interiorCandidates;
      const scored = [];
      for (const candidate of candidates) {
        const v = bilinearPartitionVec(currentFrame, packet.kind, candidate[0], candidate[1]);
        if (!v || !v.speed) continue;
        const inward = (candidate[0] === bbox[0] ? v.u : candidate[0] === bbox[2] ? -v.u : 0) +
          (candidate[1] === bbox[1] ? v.v : candidate[1] === bbox[3] ? -v.v : 0);
        let score;
        if (packet.kind === 'swell') {
          // Swell source strength is proportional to wave energy (H²), and
          // only boundaries facing into the propagation vector are favored.
          score = v.speed * v.speed * Math.max(0, inward);
        } else {
          const wind = bilinearPartitionVec(currentFrame, 'wind', candidate[0], candidate[1]);
          const alignment = wind && wind.speed
            ? Math.max(0, (v.u * wind.u + v.v * wind.v) / (v.speed * wind.speed))
            : 0;
          // Wind-wave generation is strongest where local wind and wave
          // propagation agree; H² keeps births concentrated in energetic cells.
          score = v.speed * v.speed * (0.15 + 0.85 * alignment);
        }
        if (score > 0) scored.push({ candidate, score });
      }
      if (!scored.length) return;
      const total = scored.reduce((sum, item) => sum + item.score, 0);
      let pick = Math.random() * total;
      let best = scored[scored.length - 1].candidate;
      for (const item of scored) {
        pick -= item.score;
        if (pick <= 0) { best = item.candidate; break; }
      }
      packet.lon = best[0]; packet.lat = best[1]; packet.age = 0;
    }

    // Generic streamline tracer for any (height, direction) field in the frame.
    // Reuses the same Euler-integration approach as drawStreamlines but with
    // arbitrary field keys and stroke style.
    function tracePartitionStreamline(field, lon0, lat0) {
      const fieldName = field.kind;
      const path = [];
      let lon = lon0, lat = lat0;
      let prevU = null, prevV = null;
      // Lower calm threshold than wind: swell can be < 0.5 ft in places but
      // still carry useful direction. Wind-wave is much weaker; we want it
      // visible even at 0.2 ft.
      const calmThreshold = fieldName === 'swell' ? 0.4 : 0.15;
      const baseStepDeg = fieldName === 'swell' ? 0.10 : 0.07;
      const maxSpeed = fieldName === 'swell' ? 4.0 : 2.0; // normalize partition magnitudes
      for (let i = 0; i < 30; i++) {
        if (lon < field.bbox[0] || lon > field.bbox[2] || lat < field.bbox[1] || lat > field.bbox[3]) break;
        path.push([lon, lat]);
        const vec = bilinearPartitionVec(currentFrame, fieldName, lon, lat);
        if (!vec) break;
        const sp = Math.sqrt(vec.u * vec.u + vec.v * vec.v);
        if (sp < calmThreshold) break;
        if (prevU !== null) {
          const prevSp = Math.sqrt(prevU * prevU + prevV * prevV);
          const cosine = (vec.u * prevU + vec.v * prevV) / (sp * prevSp);
          if (cosine < -0.15) break;
        }
        const stepDeg = baseStepDeg * Math.min(1, sp / maxSpeed);
        const cosLat = Math.max(0.35, Math.cos(lat * Math.PI / 180));
        lon += (vec.u / sp) * stepDeg / cosLat;
        lat += (vec.v / sp) * stepDeg;
        for (let j = Math.max(0, path.length - 8); j < path.length - 2; j++) {
          const prior = path[j];
          if (Math.hypot(lon - prior[0], lat - prior[1]) < 0.035) return path;
        }
        prevU = vec.u;
        prevV = vec.v;
      }
      return path;
    }

    // Bilinear vector sample for any partition: swell / wind_wave / atmospheric wind.
    function bilinearPartitionVec(frame, kind, lon, lat) {
      const lons = forecastData.lons, lats = forecastData.lats;
      let spGrid, dgGrid;
      if (kind === 'swell') {
        spGrid = frame.swell_height_ft;
        dgGrid = frame.swell_direction_deg;
      } else if (kind === 'wind_wave') {
        spGrid = frame.wind_wave_height_ft;
        dgGrid = frame.wind_wave_direction_deg;
      } else if (kind === 'wind') {
        spGrid = frame.wind_speed_kn;
        dgGrid = frame.wind_direction_deg;
      } else return null;
      if (!spGrid || !dgGrid || lons.length < 2 || lats.length < 2) return null;
      if (lon < lons[0] || lon > lons[lons.length-1] || lat < lats[0] || lat > lats[lats.length-1]) return null;
      const dlon = (lons[lons.length-1] - lons[0]) / (lons.length-1);
      const dlat = (lats[lats.length-1] - lats[0]) / (lats.length-1);
      const xf = (lon - lons[0]) / dlon, yf = (lat - lats[0]) / dlat;
      const x0 = Math.max(0, Math.min(lons.length-2, Math.floor(xf)));
      const y0 = Math.max(0, Math.min(lats.length-2, Math.floor(yf)));
      const tx = xf - x0, ty = yf - y0;
      const corner = (yy, xx) => {
        const sp = spGrid[yy]?.[xx], deg = dgGrid[yy]?.[xx];
        if (sp == null || deg == null || !Number.isFinite(sp) || !Number.isFinite(deg)) return null;
        const rad = Number(deg) * Math.PI / 180;
        // Meteorological convention: arrow points FROM. Flip so streamlines
        // show direction-of-travel (where the wave is going).
        return { u: -Number(sp) * Math.sin(rad), v: -Number(sp) * Math.cos(rad) };
      };
      const c00 = corner(y0, x0), c10 = corner(y0, x0 + 1);
      const c01 = corner(y0 + 1, x0), c11 = corner(y0 + 1, x0 + 1);
      if (!c00 || !c10 || !c01 || !c11) return null;
      const blend = key => c00[key] * (1-tx)*(1-ty) + c10[key] * tx*(1-ty) + c01[key] * (1-tx)*ty + c11[key] * tx*ty;
      const uu = blend('u'), vv = blend('v');
      return { u: uu, v: vv, speed: Math.sqrt(uu * uu + vv * vv) };
    }

    function drawPartitionStreamlines(kind, strokeStyle, lineWidth) {
      const lons = forecastData.lons, lats = forecastData.lats;
      const field = { kind, bbox: fieldBbox, lons, lats };
      const latStep = 1, lonStep = 1;
      const bucketPx = 3;
      const keyFor = (px, py) => `${Math.round(px/bucketPx)},${Math.round(py/bucketPx)}`;
      const used = new Set();
      // Partition magnitude for alpha scaling
      const maxSpeed = kind === 'swell' ? 4.0 : 2.0;
      for (let yi = 1; yi < lats.length - 1; yi += latStep) {
        for (let xi = 1; xi < lons.length - 1; xi += lonStep) {
          if (lons[xi] < bbox[0] || lons[xi] > bbox[2] ||
              lats[yi] < bbox[1] || lats[yi] > bbox[3]) continue;
          if (!isOceanPoint(lons[xi], lats[yi])) continue;
          const seedProj = ol.proj.fromLonLat([lons[xi], lats[yi]], rasterProjection);
          const seedPx = map.getPixelFromCoordinate(seedProj);
          if (!seedPx) continue;
          const seedKey = keyFor(seedPx[0], seedPx[1]);
          if (used.has(seedKey)) continue;
          const path = tracePartitionStreamline(field, lons[xi], lats[yi]);
          if (path.length < 2) continue;
          used.add(seedKey);
          const mid = path[Math.floor(path.length / 2)];
          const vec = bilinearPartitionVec(currentFrame, field.kind, mid[0], mid[1]);
          if (!vec) continue;
          const sp = vec.speed;
          const t = Math.min(1, sp / maxSpeed);
          const alpha = 0.55 + 0.35 * t;
          streamlineCtx.globalAlpha = alpha;
          streamlineCtx.strokeStyle = strokeStyle;
          streamlineCtx.lineWidth = lineWidth;
          streamlineCtx.lineCap = 'round';
          streamlineCtx.lineJoin = 'round';
          // Tail fade (last 35%) so streamlines don't form a wall at bbox edge.
          const faded = fadeTailAlpha(path, flowCanvas.width, flowCanvas.height);
          // CCOM's wave display uses packets, not uninterrupted streamlines:
          // short dashes advance along the integrated path as time plays.
          // The frame clock supplies a stable phase, so packets travel between
          // forecast frames without adding a second animation loop.
          const packetPeriod = 9;
          const packetLength = 4;
          const packetPhase = (frameIdx + (kind === 'wind_wave' ? 3 : 0)) % packetPeriod;
          let prevPx = null;
          for (let pointIdx = 1; pointIdx < faded.length; pointIdx++) {
            const seg = faded[pointIdx];
            const proj = ol.proj.fromLonLat([seg.pt[0], seg.pt[1]], rasterProjection);
            const px = map.getPixelFromCoordinate(proj);
            if (!px) { prevPx = null; continue; }
            if (!prevPx) { prevPx = px; continue; }
            if (((pointIdx + packetPhase) % packetPeriod) >= packetLength) {
              prevPx = px;
              continue;
            }
            streamlineCtx.globalAlpha = alpha * seg.alpha;
            streamlineCtx.beginPath();
            streamlineCtx.moveTo(prevPx[0], prevPx[1]);
            streamlineCtx.lineTo(px[0], px[1]);
            streamlineCtx.stroke();
            prevPx = px;
          }
        }
      }
      streamlineCtx.globalAlpha = 1;
    }

    // Wave phase crests are not streamlines. A crest's long axis is
    // perpendicular to propagation, so render short moving phase segments
    // whose normal follows the partition vector. This is the geometry used
    // by the CCOM/JHC wave display: black swell crests and pink wind-wave
    // crests advance in the direction encoded by their respective fields.
    function drawPartitionStreamlines(kind, strokeStyle, lineWidth) {
      const lons = forecastData.lons, lats = forecastData.lats;
      const stride = 1;
      const phasePeriod = 8;
      const phase = frameIdx % phasePeriod;
      const crestHalfLength = kind === 'swell' ? 0.13 : 0.10;
      const maxSpeed = kind === 'swell' ? 4.0 : 2.0;
      for (let yi = 1; yi < lats.length - 1; yi += stride) {
        for (let xi = 1; xi < lons.length - 1; xi += stride) {
          // Animate packets through the lattice instead of drawing every
          // crest continuously. Offset the two partitions so they remain
          // visually separable while sharing the same physical field.
          if ((xi + yi + phase + (kind === 'wind_wave' ? 3 : 0)) % phasePeriod >= 4) continue;
          const lon = lons[xi], lat = lats[yi];
          if (lon < bbox[0] || lon > bbox[2] || lat < bbox[1] || lat > bbox[3]) continue;
          const vec = bilinearPartitionVec(currentFrame, kind, lon, lat);
          if (!vec || vec.speed < (kind === 'swell' ? 0.4 : 0.15)) continue;
          const c = map.getPixelFromCoordinate(ol.proj.fromLonLat([lon, lat], rasterProjection));
          if (!c) continue;
          // Rotate the propagation vector by 90° to obtain the crest tangent.
          const inv = 1 / vec.speed;
          const tx = -vec.v * inv, ty = vec.u * inv;
          const p0 = map.getPixelFromCoordinate(ol.proj.fromLonLat([
            lon - tx * crestHalfLength / Math.max(0.35, Math.cos(lat * Math.PI / 180)), lat - ty * crestHalfLength
          ], rasterProjection));
          const p1 = map.getPixelFromCoordinate(ol.proj.fromLonLat([
            lon + tx * crestHalfLength / Math.max(0.35, Math.cos(lat * Math.PI / 180)), lat + ty * crestHalfLength
          ], rasterProjection));
          if (!p0 || !p1) continue;
          const alpha = 0.48 + 0.42 * Math.min(1, vec.speed / maxSpeed);
          streamlineCtx.globalAlpha = alpha;
          streamlineCtx.strokeStyle = strokeStyle;
          streamlineCtx.lineWidth = lineWidth;
          streamlineCtx.lineCap = 'round';
          streamlineCtx.beginPath();
          streamlineCtx.moveTo(p0[0], p0[1]);
          streamlineCtx.lineTo(p1[0], p1[1]);
          streamlineCtx.stroke();
        }
      }
      streamlineCtx.globalAlpha = 1;
    }

    // White arrows for atmospheric 10-m wind. Subsample the grid for legibility.
    function drawAtmosphericWindArrows() {
      const lons = forecastData.lons, lats = forecastData.lats;
      const stride = 2; // 17x21 -> ~9 arrows per axis
      const r = activeRange || { vmin: 0, vmax: 25 };
      const magRange = r.vmax - r.vmin || 25;
      const minLen = 8, maxLen = 26;
      const minHead = 3, maxHead = 6;
      flowCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      flowCtx.fillStyle   = 'rgba(255, 255, 255, 0.92)';
      // Subtle dark halo so white arrows pop on the dark basemap and over
      // bright heat cells alike. Two strokes per arrow: one wide dark, one
      // narrow white.
      const halo = 'rgba(7, 17, 29, 0.55)';
      for (let yi = 1; yi < lats.length - 1; yi += stride) {
        for (let xi = 1; xi < lons.length - 1; xi += stride) {
          const lon = lons[xi], lat = lats[yi];
          const sp = currentFrame.wind_speed_kn?.[yi]?.[xi];
          const dg = currentFrame.wind_direction_deg?.[yi]?.[xi];
          if (sp == null || dg == null) continue;
          const rad = dg * Math.PI / 180;
          const u = -Math.sin(rad), v = -Math.cos(rad);
          const proj = ol.proj.fromLonLat([lon, lat], rasterProjection);
          const c = map.getPixelFromCoordinate(proj);
          if (!c) continue;
          const t = Math.max(0, Math.min(1, (sp - r.vmin) / magRange));
          const len = minLen + t * (maxLen - minLen);
          const head = minHead + t * (maxHead - minHead);
          const tx = c[0] + u * len, ty = c[1] - v * len;
          // Halo stem
          flowCtx.lineWidth = 2.4 + t * 1.0;
          flowCtx.strokeStyle = halo;
          flowCtx.beginPath();
          flowCtx.moveTo(c[0], c[1]);
          flowCtx.lineTo(tx, ty);
          flowCtx.stroke();
          // White stem
          flowCtx.lineWidth = 1.0 + t * 0.8;
          flowCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
          flowCtx.beginPath();
          flowCtx.moveTo(c[0], c[1]);
          flowCtx.lineTo(tx, ty);
          flowCtx.stroke();
          // Arrowhead with halo
          const ang = Math.atan2(-v, u);
          flowCtx.fillStyle = halo;
          flowCtx.beginPath();
          flowCtx.moveTo(tx, ty);
          flowCtx.lineTo(tx - (head + 1.2) * Math.cos(ang - 0.45), ty - (head + 1.2) * Math.sin(ang - 0.45));
