<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefing Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #050b10; color: #b3e5fc; overflow: hidden; }

    .bv-toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: rgba(5, 11, 16, 0.95);
      border-bottom: 1px solid #1b2836; backdrop-filter: blur(6px);
      flex-wrap: wrap;
    }
    .bv-back { color: #4fc3f7; text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid #2a3a4d; border-radius: 4px; }
    .bv-back:hover { background: #1b2836; }
    .bv-title { margin: 0; font-size: 15px; font-weight: 600; color: #e3f2fd; }
    .bv-time { font-size: 12px; color: #9fb0c3; margin-left: 4px; font-family: monospace; }

    .bv-products { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
    .bv-products button {
      background: #1b2836; color: #b3e5fc; border: 1px solid #2a3a4d;
      padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .bv-products button:hover { background: #2a3a4d; }
    .bv-products button.active {
      background: #4fc3f7; color: #050b10; border-color: #4fc3f7; font-weight: 600;
    }
    .bv-products .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot-temp { background: #ff8c00; }
    .dot-wave { background: #00c8ff; }
    .dot-swell { background: #8bd7ff; }
    .dot-wind { background: #62e58a; }
    .dot-press { background: #c59bff; }

    .bv-framebar {
      position: fixed; bottom: 56px; left: 0; right: 0; z-index: 15;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 14px; background: rgba(5, 11, 16, 0.95);
      border-top: 1px solid #1b2836;
    }
    .bv-framebar button {
      background: #1b2836; color: #b3e5fc; border: 1px solid #2a3a4d;
      width: 32px; height: 32px; border-radius: 4px; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .bv-framebar button:hover { background: #2a3a4d; }
    .bv-framebar button.playing { background: #4fc3f7; color: #050b10; border-color: #4fc3f7; }
    #bv-slider { flex: 1; min-width: 100px; accent-color: #4fc3f7; height: 6px; }
    .bv-frame-label { font-size: 12px; color: #e3f2fd; font-family: monospace; min-width: 140px; text-align: right; }

    .bv-ranges {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 14;
      background: rgba(5, 11, 16, 0.95);
      border-top: 1px solid #1b2836;
      padding: 8px 14px 10px;
      pointer-events: none;
    }
    .bv-ranges-title { font-size: 11px; color: #9fb0c3; font-family: monospace; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bv-ranges-title b { color: #e3f2fd; font-weight: 600; }
    #bv-cbar { width: 100%; height: 32px; }
    .bv-ranges-ticks { display: flex; justify-content: space-between; font-size: 10px; color: #9fb0c3; font-family: monospace; margin-top: 2px; }

    .bv-map { position: absolute; top: 48px; left: 0; right: 0; bottom: 110px; touch-action: none; }
    .bv-flow-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; mix-blend-mode: screen; }
    .bv-streamlines-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

    .ol-attribution { color: #6b7d92 !important; background: rgba(5, 11, 16, 0.8) !important; font-size: 10px !important; pointer-events: none; }
    .ol-control button { background-color: rgba(5, 11, 16, 0.8) !important; color: #b3e5fc !important; }
    .ol-zoom { top: auto; bottom: auto; right: 0.5em; left: auto; }
    .ol-scale-line { pointer-events: none; }

    @media (max-width: 640px) {
      .bv-toolbar { padding: 6px 8px; gap: 6px; }
      .bv-back { font-size: 11px; padding: 3px 6px; }
      .bv-title { font-size: 13px; }
      .bv-time { display: none; }
      .bv-products button { font-size: 11px; padding: 3px 6px; }
      .bv-map { bottom: 96px; }
      .bv-frame-label { min-width: auto; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="bv-toolbar">
    <a class="bv-back" href="javascript:history.back()">← Back</a>
    <div>
      <h1 class="bv-title">Briefing Viewer — <span id="bv-region">usec_md</span></h1>
      <div class="bv-time" id="bv-time">7-Day Outlook · loading forecast…</div>
    </div>
    <div class="bv-products" id="bv-products">
      <button data-prod="temperature_f" class="active"><span class="dot dot-temp"></span>Temp</button>
      <button data-prod="wave_height_ft"><span class="dot dot-wave"></span>Wave</button>
      <button data-prod="swell_height_ft"><span class="dot dot-swell"></span>Swell</button>
      <button data-prod="wind_speed_kn"><span class="dot dot-wind"></span>Wind</button>
      <button data-prod="pressure_hpa"><span class="dot dot-press"></span>Pressure</button>
    </div>
  </div>

  <div id="bv-map" class="bv-map"></div>

  <div class="bv-framebar">
    <button id="bv-prev" aria-label="Previous frame">‹</button>
    <button id="bv-play" aria-label="Play">▶</button>
    <input id="bv-slider" type="range" min="0" max="0" step="1" value="0" aria-label="Frame">
    <button id="bv-next" aria-label="Next frame">›</button>
    <span class="bv-frame-label" id="bv-frame-label">—</span>
  </div>

  <div class="bv-ranges">
    <div class="bv-ranges-title">
      <b id="bv-cbar-name">Temperature</b>
      <span id="bv-cbar-unit">°F</span>
    </div>
    <canvas id="bv-cbar" width="1000" height="32"></canvas>
    <div class="bv-ranges-ticks" id="bv-cbar-ticks"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
  <script>
  (function () {
    'use strict';

    // ---- params / region ----
    const params = new URLSearchParams(window.location.search);
    const targetDate = params.get('date') || new Date().toISOString().slice(0, 10);
    const region = params.get('region') || 'usec_md';
    document.getElementById('bv-region').textContent = region;

    const BBOXES = {
      usec_md:    [-77.0, 36.0, -72.0, 40.0],
      usec_south: [-81.0, 31.0, -73.0, 36.0],
    };
    const bbox = BBOXES[region] || BBOXES.usec_md;
    let fieldBbox = bbox;
    const rasterProjection = 'EPSG:4326';

    // ---- product definitions (mirrors captain's dashboard scale choices) ----
    // Inspired by captain's dashboard scales (CHL_ALGAE, SST_SCALE, UV_SCALE,
    // SLA_SCALE, BATHY_SCALE) in dashboard/index.html. Each product uses a
    // perceptually-uniform 7-stop gradient; user_ranges set the [vmin, vmax].
    // Per-variable viz pattern (Mike #34568: "plot each data variable based on its characteristics"):
    //  - heat      -> bilinear raster tile as a heat map
    //  - arrows    -> heat + vector arrows on top (uses *_direction_deg)
    //  - streamlines -> Euler-integrated streamlines over the (u,v) field, no heat fill
    //  - contours  -> marching-squares isobars (for pressure)
    //  - dynamicRange=true recomputes [vmin, vmax] from the actual frame data
    //    so the colorbar isn't clipped when the data sits outside the default range.
    const PRODUCTS = {
      temperature_f: { name: 'Temperature', unit: '°F', scale: 'SST', viz: 'heat',        dynamicRange: true  },
      wave_height_ft:{ name: 'Wave height', unit: 'ft',  scale: 'UV',  viz: 'arrows',      dirKey: 'wave_direction_deg', dynamicRange: true },
      swell_height_ft:{name: 'Swell height',unit: 'ft',  scale: 'UV',  viz: 'arrows',      dirKey: 'swell_direction_deg', dynamicRange: true },
      wind_speed_kn: { name: 'Wind flow',   unit: 'kn',  scale: 'CHL', viz: 'streamlines', dynamicRange: false },
      pressure_hpa:  { name: 'Pressure',    unit: 'hPa', scale: 'SLA', viz: 'contours',    dynamicRange: true  },
    };

    // viridis-like 7-stop palette (matches captain's UV_SCALE / CHL_ALGAE feel)
    const SCALES = {
      SST: [[0.0,'#2166ac'],[0.18,'#4393c3'],[0.36,'#92c5de'],[0.5,'#f7f7f7'],[0.64,'#fddbc7'],[0.82,'#f4a582'],[1.0,'#b2182b']],
      UV:  [[0.0,'#440154'],[0.17,'#443983'],[0.34,'#31688e'],[0.5,'#35b779'],[0.67,'#90d743'],[0.83,'#fde725'],[1.0,'#fff7bc']],
      CHL: [[0.0,'#001f3f'],[0.2,'#0074d9'],[0.4,'#39cccc'],[0.5,'#2ecc40'],[0.7,'#ffdc00'],[0.85,'#ff851b'],[1.0,'#ff4136']],
      SLA: [[0.0,'#2166ac'],[0.25,'#67a9cf'],[0.5,'#f7f7f7'],[0.75,'#ef8a62'],[1.0,'#b2182b']],
    };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexToRgb(hex) {
      const m = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
      return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [255,255,255];
    }
    function rgbToHex(r,g,b) {
      const h = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0');
      return '#' + h(r) + h(g) + h(b);
    }
    function sampleScale(scale, t) {
      const stops = SCALES[scale] || SCALES.SST;
      for (let i = 0; i < stops.length - 1; i++) {
        if (t <= stops[i+1][0]) {
          const u = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
          const c0 = hexToRgb(stops[i][1]);
          const c1 = hexToRgb(stops[i+1][1]);
          return rgbToHex(lerp(c0[0], c1[0], u), lerp(c0[1], c1[1], u), lerp(c0[2], c1[2], u));
        }
      }
      return stops[stops.length-1][1];
    }

    // ---- data ----
    let forecastData = null; // { bbox, frame_interval_hours, frames, lons, lats }
    let frameIdx = 0;
    let playTimer = null;

    const FORECAST_URL = `https://data.fishedge.live/${region}/briefing/forecast.json`;
    const DEV_FORECAST_URL = `/dashboard/trip-planner/data/${region}/briefing/forecast.json`;
    const CORS_PROXY = 'https://corsproxy.io/?';
    const MAX_FORECAST_AGE_HOURS = 12;

    async function fetchJson(url) {
      try {
        const r = await fetch(url, { cache: 'no-store', mode: 'cors' });
        if (r.ok) return await r.json();
      } catch (_) {}
      const proxied = CORS_PROXY + encodeURIComponent(url);
      const r = await fetch(proxied, { cache: 'no-store' });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    }

    // ---- ol setup ----
    const baseLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        // Mike #34713: 'still artifacts in wind map' — the @2x retina
        // suffix doesn't exist at the low zoom levels (5.5) we use, so
        // OL falls back to standard tiles and the coastline becomes
        // pixelated (the staircase artifact the user keeps seeing on the
        // basemap). Drop @2x — the standard dark_all tiles are already
        // 256×256 and look correct at this zoom.
        url: 'https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
        attributions: '© OpenStreetMap contributors © CARTO',
        maxZoom: 19,
        crossOrigin: 'anonymous',
      }),
      opacity: 0.7,
      zIndex: 0,
    });

    const map = new ol.Map({
      target: 'bv-map',
      layers: [baseLayer],
      view: new ol.View({
        projection: rasterProjection,
        center: [(bbox[0]+bbox[2])/2, (bbox[1]+bbox[3])/2],
        zoom: 5.5,
        minZoom: 4,
        maxZoom: 12,
        extent: [bbox[0]-1, bbox[1]-1, bbox[2]+1, bbox[3]+1],
      }),
      controls: ol.control.defaults.defaults({ attribution: true, rotate: false }).extend([
        new ol.control.ScaleLine(),
      ]),
    });

    // Dev-only domain diagnostics: show the target box and the larger field
    // used by streamline integration once the forecast metadata is loaded.
    const domainSource = new ol.source.Vector();
    const domainLayer = new ol.layer.Vector({
      source: domainSource,
      zIndex: 8,
      style: feature => feature.get('kind') === 'field'
        ? new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(255,193,7,0.9)', width: 2, lineDash: [8, 6] }) })
        : new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(79,195,247,0.95)', width: 2 }) }),
    });
    map.addLayer(domainLayer);
    const devDiagnostics = window.location.hostname.startsWith('feat-');
    function drawDomainDiagnostics() {
      if (!devDiagnostics || !Array.isArray(fieldBbox)) return;
      domainSource.clear();
      const ring = extent => ol.geom.Polygon.fromExtent(extent);
      const fieldFeature = new ol.Feature(ring(fieldBbox));
      fieldFeature.set('kind', 'field');
      const targetFeature = new ol.Feature(ring(bbox));
      targetFeature.set('kind', 'target');
      domainSource.addFeatures([fieldFeature, targetFeature]);
      map.getView().set('extent', fieldBbox);
    }

    // overlays for wind streamlines + animated particles
    const mapEl = document.getElementById('bv-map');
    const streamlineCanvas = document.createElement('canvas');
    streamlineCanvas.className = 'bv-streamlines-canvas';
    streamlineCanvas.setAttribute('aria-hidden', 'true');
    mapEl.appendChild(streamlineCanvas);
    const streamlineCtx = streamlineCanvas.getContext('2d');
    const flowCanvas = document.createElement('canvas');
    flowCanvas.className = 'bv-flow-canvas';
    flowCanvas.setAttribute('aria-hidden', 'true');
    mapEl.appendChild(flowCanvas);
    const flowCtx = flowCanvas.getContext('2d');

    // client-rendered raster layer (replaces old PNG ImageStatic)
    const rasterLayer = new ol.layer.Image({
      source: new ol.source.ImageCanvas({
        projection: rasterProjection,
        ratio: 1,
        interpolate: true,
        canvasFunction: (requestedExtent, resolution, pixelRatio, size) => {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.ceil(size[0]));
          c.height = Math.max(1, Math.ceil(size[1]));
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          if (!forecastData || !frameIdx || !currentFrame) return c;
          // Mike #34665: 'when I zoom in there is a color layer, which is
          // unknown.' For viz='streamlines' and viz='contours' we DO NOT want
          // a heat-map fill under the vector overlay — the streamlines/isobars
          // carry the visual signal. Skip drawFrameToTile so the raster layer
          // is transparent for those products.
          const viz = (PRODUCTS[currentProduct] || {}).viz;
          if (viz === 'streamlines' || viz === 'contours') return c;
          drawFrameToTile(ctx, currentFrame, currentProduct, requestedExtent, c.width, c.height);
          return c;
        },
      }),
      opacity: 0.85,
      zIndex: 5,
    });
    map.addLayer(rasterLayer);

    // ---- state ----
    let currentProduct = 'temperature_f';
    let currentFrame = null;
    let activeRange = null; // {vmin, vmax} computed per-frame when dynamicRange=true
    const particles = [];

    function nearestFrameIdxToDate(frames, wantedDate) {
      if (!frames || !frames.length) return 0;
      let bestI = 0, bestDist = Infinity;
      for (let i = 0; i < frames.length; i++) {
        const t = frames[i].time || '';
        const dist = Math.abs(new Date(t + 'Z').getTime() - new Date(wantedDate + 'T12:00:00Z').getTime());
        if (dist < bestDist) { bestDist = dist; bestI = i; }
      }
      return bestI;
    }

    // ---- raster tile rendering (interpolates grid bilinearly into the tile extent) ----
    function drawFrameToTile(ctx, frame, productKey, requestedExtent, w, h) {
      const grid = frame[productKey];
      if (!grid || !grid.length || !grid[0].length) return;
      const lons = forecastData.lons, lats = forecastData.lats;
      if (!lons || !lats || lons.length < 2 || lats.length < 2) return;
      const def = PRODUCTS[productKey];
      // dynamic per-frame range — fall back to (0, 30) if activeRange not yet computed.
      // (Bug fix #0f6434f4: PRODUCTS no longer carries vmin/vmax on each entry;
      // drawFrameToTile was reading undefined and rasterizing NaN pixels.)
      const r = activeRange || { vmin: 0, vmax: 30 };
      const vmin = r.vmin, vmax = r.vmax;
      const scale = def.scale;

      // pixel coords from lon/lat
      const toX = lon => ((lon - requestedExtent[0]) / (requestedExtent[2] - requestedExtent[0])) * w;
      const toY = lat => ((requestedExtent[3] - lat) / (requestedExtent[3] - requestedExtent[1])) * h;

      const nx = lons.length, ny = lats.length;
      const dlon = (lons[nx-1] - lons[0]) / (nx - 1);
      const dlat = (lats[ny-1] - lats[0]) / (ny - 1);

      // bilinear sample of grid at lon,lat
      const sample = (lon, lat) => {
        if (lon < lons[0] || lon > lons[nx-1] || lat < lats[0] || lat > lats[ny-1]) return null;
        const xf = (lon - lons[0]) / dlon;
        const yf = (lat - lats[0]) / dlat;
        const x0 = Math.max(0, Math.min(nx-2, Math.floor(xf)));
        const y0 = Math.max(0, Math.min(ny-2, Math.floor(yf)));
        const x1 = x0 + 1, y1 = y0 + 1;
        const tx = xf - x0, ty = yf - y0;
        const g = grid;
        const a = g[y0]?.[x0], b = g[y0]?.[x1], c = g[y1]?.[x0], d = g[y1]?.[x1];
        if (a == null || b == null || c == null || d == null) return null;
        return a*(1-tx)*(1-ty) + b*tx*(1-ty) + c*(1-tx)*ty + d*tx*ty;
      };

      // Fill the tile by walking the source grid lattice (fast path):
      // for each grid cell, draw a quad with linear color interpolation per row.
      const cellW = Math.abs(toX(lons[1]) - toX(lons[0]));
      const cellH = Math.abs(toY(lats[1]) - toY(lats[0]));
      // quad per cell
      for (let yi = 0; yi < ny - 1; yi++) {
        for (let xi = 0; xi < nx - 1; xi++) {
          const v00 = grid[yi][xi];
          const v10 = grid[yi][xi+1];
          const v01 = grid[yi+1][xi];
          const v11 = grid[yi+1][xi+1];
          if (v00 == null || v10 == null || v01 == null || v11 == null) continue;
          const px = toX(lons[xi]);
          const py = toY(lats[yi]);
          const npx = toX(lons[xi+1]);
          const npy = toY(lats[yi+1]);
          const wpx = npx - px;
          const hpx = py - npy;

          // Bilinear sample four corners and rasterize quad by scanlines
          // (fast enough for 17×21 grid, gives smooth gradient between cells).
          const minX = Math.max(0, Math.floor(px));
          const maxX = Math.min(w, Math.ceil(px + wpx));
          const minY = Math.max(0, Math.floor(npy));
          const maxY = Math.min(h, Math.ceil(py));
          if (maxX <= minX || maxY <= minY) continue;

          const yDir = py > npy ? 1 : -1; // pixel y goes down, lat y goes up
          for (let yy = minY; yy < maxY; yy++) {
            // tY: 0 at top of cell, 1 at bottom
            const tY = yDir > 0 ? (py - yy) / hpx : (yy - npy) / hpx;
            const ttY = Math.max(0, Math.min(1, tY));
            const vTop = v00*(1-ttY) + v01*ttY;
            const vBot = v10*(1-ttY) + v11*ttY;
            const rowImg = ctx.createImageData(maxX - minX, 1);
            const rowData = rowImg.data;
            for (let xx = minX; xx < maxX; xx++) {
              const tX = (xx - px) / wpx;
              const ttX = Math.max(0, Math.min(1, tX));
              const v = vTop*(1-ttX) + vBot*ttX;
              const tNorm = Math.max(0, Math.min(1, (v - vmin) / (vmax - vmin)));
              const hex = sampleScale(scale, tNorm);
              const [r,g,b] = hexToRgb(hex);
              const o = (xx - minX) * 4;
              rowData[o]   = r;
              rowData[o+1] = g;
              rowData[o+2] = b;
              rowData[o+3] = 255;
            }
            ctx.putImageData(rowImg, minX, yy);
          }
        }
      }
    }

    // ---- colorbar ----
    function computeActiveRange() {
      const def = PRODUCTS[currentProduct];
      const grid = currentFrame ? currentFrame[primaryDataKey()] : null;
      if (!def.dynamicRange || !grid || !grid.length) {
        activeRange = { vmin: 0, vmax: 30 };
        return;
      }
      const flat = [];
      for (let yi = 0; yi < grid.length; yi++) {
        for (let xi = 0; xi < grid[yi].length; xi++) {
          const v = grid[yi][xi];
          if (v != null && Number.isFinite(v)) flat.push(v);
        }
      }
      if (!flat.length) { activeRange = { vmin: 0, vmax: 30 }; return; }
      let vmin = Math.min(...flat);
      let vmax = Math.max(...flat);
      // pad by 5% on each side so the colorbar isn't pinned to extremes
      const pad = (vmax - vmin) * 0.05 || Math.max(1, Math.abs(vmax) * 0.05);
      vmin -= pad; vmax += pad;
      // Use the padded raw range directly. drawColorbar already produces 5
      // evenly-spaced ticks across [vmin, vmax] with decimals based on span
      // size (decimals=0 for span>=50, 1 for >=5, 2 for tighter). Previously
      // I tried rounding to nice numbers but nice() collapsed pressure data
      // (~981..1017) to vmin=vmax=1000 because Math.log10 of values near a
      // 10^k boundary gives the wrong step. Raw range with linear ticks
      // is correct.
      activeRange = { vmin, vmax };
    }

    function drawColorbar() {
      const def = PRODUCTS[currentProduct];
      const r = activeRange || { vmin: 0, vmax: 30 };
      const canvas = document.getElementById('bv-cbar');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      for (let x = 0; x < W; x++) {
        const t = x / (W - 1);
        ctx.fillStyle = sampleScale(def.scale, t);
        ctx.fillRect(x, 0, 1, H - 8);
      }
      const ticks = document.getElementById('bv-cbar-ticks');
      ticks.innerHTML = '';
      const N = 5;
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        const v = r.vmin + (r.vmax - r.vmin) * t;
        const tick = document.createElement('span');
        const decimals = (r.vmax - r.vmin) > 50 ? 0 : (r.vmax - r.vmin) > 5 ? 1 : 2;
        tick.textContent = v.toFixed(decimals);
        ticks.appendChild(tick);
      }
      document.getElementById('bv-cbar-name').textContent = def.name;
      document.getElementById('bv-cbar-unit').textContent = def.unit;
    }

    function primaryDataKey() {
      const def = PRODUCTS[currentProduct];
      // map product key -> forecast.json grid key (they're identical for the current set)
      return currentProduct;
    }

    // ---- frame rendering ----
    function setFrame(i) {
      if (!forecastData) return;
      const frames = forecastData.frames;
      frameIdx = Math.max(0, Math.min(frames.length - 1, i));
      currentFrame = frames[frameIdx];
      document.getElementById('bv-slider').value = String(frameIdx);
      const t = currentFrame.time || '—';
      const d = new Date(/[zZ]|[+-]\d\d:\d\d$/.test(t) ? t : t + 'Z');
      const lbl = d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
      document.getElementById('bv-frame-label').textContent = lbl + ' ET';
      computeActiveRange();
      drawColorbar();
      map.render();
      drawOverlaysForProduct();
    }

    function clearOverlays() {
      streamlineCtx && streamlineCtx.clearRect(0, 0, streamlineCanvas.width, streamlineCanvas.height);
      flowCtx && flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
    }

    function drawOverlaysForProduct() {
      clearOverlays();
      const def = PRODUCTS[currentProduct];
      // Mike #34713: 'doubling' effect on coastlines was caused by the
      // rasterLayer still being in the layer stack at opacity 0.85 even
      // when drawFrameToTile returned early. Hide the layer entirely
      // when streamlines or contours are showing — they carry the viz,
      // and the raster can produce subtle doubling with the basemap.
      if (rasterLayer) {
        rasterLayer.setVisible(def.viz === 'heat' || def.viz === 'arrows');
      }
      if (def.viz === 'streamlines') {
        drawStreamlines();
        // Particles use the same weak-wind guard as streamlines. A coastline
        // mask is still a future refinement, but disabling the layer leaves
        // the diagnostic map visibly empty in broad low-wind areas.
        startParticleAnimation();
      } else if (def.viz === 'arrows') drawDirectionArrows();
      else if (def.viz === 'contours') drawIsobars();
      else stopParticleAnimation();
    }

    function clearWindOverlays() {
      streamlineCtx && streamlineCtx.clearRect(0, 0, streamlineCanvas.width, streamlineCanvas.height);
      flowCtx && flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
    }

    function bilinearVec(frame, lon, lat) {
      const lons = forecastData.lons, lats = forecastData.lats;
      const speedGrid = frame.wind_speed_kn, dirGrid = frame.wind_direction_deg;
      if (!speedGrid || !dirGrid || lons.length < 2 || lats.length < 2) return null;
      if (lon < lons[0] || lon > lons[lons.length-1] || lat < lats[0] || lat > lats[lats.length-1]) return null;
      const dlon = (lons[lons.length-1] - lons[0]) / (lons.length-1);
      const dlat = (lats[lats.length-1] - lats[0]) / (lats.length-1);
      const xf = (lon - lons[0]) / dlon, yf = (lat - lats[0]) / dlat;
      const x0 = Math.max(0, Math.min(lons.length-2, Math.floor(xf)));
      const y0 = Math.max(0, Math.min(lats.length-2, Math.floor(yf)));
      const tx = xf - x0, ty = yf - y0;
      // Interpolate the vector components, never the direction angle. A
      // scalar interpolation of 359° and 1° produces 180° and invents a
      // reversed wind axis—the exact kind of false convergence this viewer
      // previously displayed.
      const corner = (yy, xx) => {
        const sp = speedGrid[yy]?.[xx], deg = dirGrid[yy]?.[xx];
        if (sp == null || deg == null || !Number.isFinite(sp) || !Number.isFinite(deg)) return null;
        const rad = Number(deg) * Math.PI / 180;
        return { u: -Number(sp) * Math.sin(rad), v: -Number(sp) * Math.cos(rad) };
      };
      const c00 = corner(y0, x0), c10 = corner(y0, x0 + 1);
      const c01 = corner(y0 + 1, x0), c11 = corner(y0 + 1, x0 + 1);
      if (!c00 || !c10 || !c01 || !c11) return null;
      const blend = key => c00[key] * (1-tx)*(1-ty) + c10[key] * tx*(1-ty) + c01[key] * (1-tx)*ty + c11[key] * tx*ty;
      const uu = blend('u'), vv = blend('v');
      return { u: uu, v: vv, speed: Math.sqrt(uu * uu + vv * vv) };
    }

    function resizeOverlayCanvases() {
      const rect = mapEl.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const W = Math.max(1, Math.round(rect.width * dpr));
      const H = Math.max(1, Math.round(rect.height * dpr));
      [flowCanvas, streamlineCanvas].forEach(c => {
        if (c.width !== W || c.height !== H) {
          c.width = W; c.height = H;
          c.style.width = rect.width + 'px';
          c.style.height = rect.height + 'px';
        }
      });
    }

    // ---- streamlines (restored from d1074225 — Euler-integrated over the (u,v) field) ----
    // Trace one local streamline per seed by Euler integration of the local
    // (u,v) field. A long one-way trace makes most paths terminate on the
    // downstream bbox edge and creates a false convergence wall, so keep the
    // visible segment local and let particles communicate longer-range flow.
    function traceStreamline(field, lon0, lat0) {
      const path = [];
      let lon = lon0, lat = lat0;
      let prevU = null, prevV = null;
      const calmThresholdKn = 2.5;
      const baseStepDeg = 0.08;
      for (let i = 0; i < 30; i++) {
        if (lon < field.bbox[0] || lon > field.bbox[2] || lat < field.bbox[1] || lat > field.bbox[3]) break;
        path.push([lon, lat]);
        const vec = bilinearVec(currentFrame, lon, lat);
        if (!vec) break;
        const sp = Math.sqrt(vec.u * vec.u + vec.v * vec.v);
        // Weak GFS winds have an unstable direction. A fixed step after
        // normalizing the vector turns that noise into visible diamonds.
        // Below 2.5 kn, stop rather than drawing a pseudo-streamline.
        if (sp < calmThresholdKn) break;
        if (prevU !== null) {
          const prevSp = Math.sqrt(prevU * prevU + prevV * prevV);
          const cosine = (vec.u * prevU + vec.v * prevV) / (sp * prevSp);
          // A sharp reversal is numerical/model noise at this display scale,
          // not a useful continuation of the local flow line.
          if (cosine < -0.15) break;
        }
        // Preserve the long visual reach of strong winds, but make weak-wind
        // segments proportionally shorter instead of normalizing them to the
        // same 0.08° displacement.
        const stepDeg = baseStepDeg * Math.min(1, sp / 10);
        const cosLat = Math.max(0.35, Math.cos(lat * Math.PI / 180));
        lon += (vec.u / sp) * stepDeg / cosLat;
        lat += (vec.v / sp) * stepDeg;
        for (let j = Math.max(0, path.length - 8); j < path.length - 2; j++) {
          const prior = path[j];
          if (Math.hypot(lon - prior[0], lat - prior[1]) < 0.035) return path;
        }
        prevU = vec.u;
        prevV = vec.v;
      }
      return path;
    }

    // Mike #34713: streamlines abruptly terminate at bbox and low-speed
    // edges, producing visible "walls" of streamline endings along
    // meteorological fronts. Fade alpha in the last 25% of the path so
    // the wall dissolves into the basemap instead of forming a sharp edge.
    function fadeTailAlpha(rawPath, w, h) {
      const n = rawPath.length;
      if (n < 4) return rawPath;
      const tailFrac = 0.35;
      const tailStart = Math.floor(n * (1 - tailFrac));
      return rawPath.map((pt, i) => {
        if (i < tailStart) return { pt, alpha: 1 };
        const t = (i - tailStart) / (n - tailStart); // 0..1 over the tail
        const a = 1 - t; // fade 1 → 0
        return { pt, alpha: a };
      });
    }

    function drawStreamlines() {
      if (!currentFrame || !forecastData) return;
      resizeOverlayCanvases();
      const dpr = flowCanvas.width / mapEl.clientWidth;
      streamlineCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      streamlineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const lons = forecastData.lons, lats = forecastData.lats;
      const field = { bbox: fieldBbox, lons, lats };
      // Mike #34713: 'still artifacts in wind map'. The previous version
      // (latStep=1, lonStep=1, 8-px dedupe bucket) created a visible density
      // boundary along meteorological fronts: smooth regions of the field
      // threw away most seeds (neighbors bucket into the same 8-px cluster)
      // while fronts kept seeds (more variety passes the bucket). That
      // boundary IS the staircase the user sees, sitting on top of a real
      // meteorological front in the data.
      //
      // Fix: coarser stride (~85 seeds total) + much tighter bucket (4 px,
      // smaller than the seed spacing) so density is uniform across smooth
      // regions AND fronts. Streamlines then trace the actual (u,v) field
      // without per-region density boundaries.
      const latStep = 1;
      const lonStep = 1;
      const bucketPx = 3;
      const keyFor = (px, py) => `${Math.round(px/bucketPx)},${Math.round(py/bucketPx)}`;
      const maxSpeed = 30;
      const used = new Set();
      let accepted = 0;
      let boundaryExits = 0;
      for (let yi = 1; yi < lats.length - 1; yi += latStep) {
        for (let xi = 1; xi < lons.length - 1; xi += lonStep) {
          if (lons[xi] < bbox[0] || lons[xi] > bbox[2] ||
              lats[yi] < bbox[1] || lats[yi] > bbox[3]) continue;
          // Compute seed pixel position first (before tracing).
          const seedProj = ol.proj.fromLonLat([lons[xi], lats[yi]], rasterProjection);
          const seedPx = map.getPixelFromCoordinate(seedProj);
          if (!seedPx) continue;
          const seedKey = keyFor(seedPx[0], seedPx[1]);
          if (used.has(seedKey)) continue;
          const path = traceStreamline(field, lons[xi], lats[yi]);
          if (path.length < 2) continue;
          const last = path[path.length - 1];
          const edge = 0.09;
          if (last[0] <= fieldBbox[0] + edge || last[0] >= fieldBbox[2] - edge ||
              last[1] <= fieldBbox[1] + edge || last[1] >= fieldBbox[3] - edge) boundaryExits++;
          used.add(seedKey);
          accepted++;
          const mid = path[Math.floor(path.length / 2)];
          const vec = bilinearVec(currentFrame, mid[0], mid[1]);
          if (!vec) continue;
          const sp = Math.sqrt(vec.u * vec.u + vec.v * vec.v);
          const t = Math.min(1, sp / maxSpeed);
          const alpha = 0.22 + 0.40 * t;
          const r = Math.round(180 + 60 * t);
          const g = Math.round(215 + 30 * t);
          const b = 230;
          streamlineCtx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
          streamlineCtx.lineWidth = 0.9;
          streamlineCtx.lineCap = 'round';
          streamlineCtx.lineJoin = 'round';
          // Fade alpha along the last 25% of the path so streamlines ending
          // at the bbox or a low-speed cell dissolve instead of forming a
          // bright wall. Draw each segment once: a prior full-path stroke
          // silently defeated this fade and exaggerated convergence points.
          const faded = fadeTailAlpha(path, flowCanvas.width, flowCanvas.height);
          const baseAlpha = alpha;
          let prevPx = null;
          for (const seg of faded) {
            const proj = ol.proj.fromLonLat([seg.pt[0], seg.pt[1]], rasterProjection);
            const px = map.getPixelFromCoordinate(proj);
            if (!px) { prevPx = null; continue; }
            if (!prevPx) {
              streamlineCtx.moveTo(px[0], px[1]);
              prevPx = px;
              continue;
            }
            streamlineCtx.globalAlpha = baseAlpha * seg.alpha;
            streamlineCtx.beginPath();
            streamlineCtx.moveTo(prevPx[0], prevPx[1]);
            streamlineCtx.lineTo(px[0], px[1]);
            streamlineCtx.stroke();
            prevPx = px;
          }
          streamlineCtx.globalAlpha = 1;
        }
      }
      if (devDiagnostics) console.log(`[streamlines] accepted=${accepted} field-boundary exits=${boundaryExits}`);
    }

    // ---- direction arrows for wave / swell products ----
    function drawDirectionArrows() {
      if (!currentFrame || !forecastData) return;
      resizeOverlayCanvases();
      const dpr = flowCanvas.width / mapEl.clientWidth;
      flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const def = PRODUCTS[currentProduct];
      const dirGrid = currentFrame[def.dirKey];
      const magGrid = currentFrame[currentProduct]; // wave/swell height drives arrow length
      if (!dirGrid || !dirGrid.length || !magGrid || !magGrid.length) return;
      const lons = forecastData.lons, lats = forecastData.lats;

      // Quiver-style arrows: stem length scales with wave height (small swell -> tiny arrow,
      // big swell -> long arrow). Arrowhead size scales with magnitude too, so the visual
      // signature carries the height information, not just direction.
      const r = activeRange || { vmin: 0, vmax: 6 };
      const magRange = r.vmax - r.vmin || 6;
      const minLen = 6, maxLen = 30;
      const minHead = 3, maxHead = 6;
      flowCtx.strokeStyle = 'rgba(15, 25, 45, 0.95)';
      flowCtx.fillStyle   = 'rgba(15, 25, 45, 0.95)';

      // Subsample: only draw arrows on alternating cells so the map isn't overcrowded.
      // 17x21 grid -> 9 arrows per axis at most.
      const stride = 2;
      for (let yi = 1; yi < lats.length - 1; yi += stride) {
        for (let xi = 1; xi < lons.length - 1; xi += stride) {
          const lon = lons[xi], lat = lats[yi];
          const dirDeg = dirGrid[yi]?.[xi];
          const mag = magGrid[yi]?.[xi];
          if (dirDeg == null || mag == null) continue;
          const rad = dirDeg * Math.PI / 180;
          // meteorological: arrow points where it's coming FROM. Flip 180° so the arrow
          // shows where the wave is GOING TO.
          const u = -Math.sin(rad), v = -Math.cos(rad);
          const proj = ol.proj.fromLonLat([lon, lat], rasterProjection);
          const c = map.getPixelFromCoordinate(proj);
          if (!c) continue;
          const t = Math.max(0, Math.min(1, (mag - r.vmin) / magRange));
          const len = minLen + t * (maxLen - minLen);
          const head = minHead + t * (maxHead - minHead);
          const tx = c[0] + u * len, ty = c[1] - v * len; // OL pixel y grows downward, math y grows up
          // Stem (thicker for bigger waves)
          flowCtx.lineWidth = 0.9 + t * 0.9;
          flowCtx.beginPath();
          flowCtx.moveTo(c[0], c[1]);
          flowCtx.lineTo(tx, ty);
          flowCtx.stroke();
          // Arrowhead
          const ang = Math.atan2(-v, u);
          flowCtx.beginPath();
          flowCtx.moveTo(tx, ty);
          flowCtx.lineTo(tx - head * Math.cos(ang - 0.45), ty - head * Math.sin(ang - 0.45));
          flowCtx.lineTo(tx - head * Math.cos(ang + 0.45), ty - head * Math.sin(ang + 0.45));
          flowCtx.closePath();
          flowCtx.fill();
        }
      }
    }

    // ---- isobars (marching squares for pressure) ----
    function drawIsobars() {
      if (!currentFrame || !forecastData) return;
      resizeOverlayCanvases();
      const dpr = flowCanvas.width / mapEl.clientWidth;
      flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
      flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const grid = currentFrame.pressure_hpa;
      if (!grid || !grid.length) return;
      const lons = forecastData.lons, lats = forecastData.lats;
      const nx = lons.length, ny = lats.length;
      const flat = grid.flat().filter(v => v != null && Number.isFinite(v));
      if (!flat.length) return;
      const vmin = Math.min(...flat), vmax = Math.max(...flat);
      const step = 2; // hPa
      const levels = [];
      for (let v = Math.ceil(vmin / step) * step; v <= vmax; v += step) levels.push(v);
      flowCtx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      flowCtx.lineWidth = 0.8;
      flowCtx.font = '9px monospace';
      flowCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      const toPxX = lon => map.getPixelFromCoordinate(ol.proj.fromLonLat([lon, lats[0]], rasterProjection))?.[0];
      const toPxY = lat => map.getPixelFromCoordinate(ol.proj.fromLonLat([lons[0], lat], rasterProjection))?.[1];
      const xMin = toPxX(lons[0]), xMax = toPxX(lons[nx-1]);
      const yMin = toPxY(lats[ny-1]), yMax = toPxY(lats[0]);
      const w = xMax - xMin, h = yMin - yMax;
      if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 0 || h <= 0) return;
      const lerp = (a, b, t) => a + (b - a) * t;
      const sample = (xi, yi) => {
        if (xi < 0 || xi >= nx || yi < 0 || yi >= ny) return null;
        return grid[yi]?.[xi];
      };
      const lerpX = (xa, ya, va, xb, yb, vb, level) => {
        if (Math.abs(va - vb) < 1e-9) return [(xa+xb)/2, (ya+yb)/2];
        const t = (level - va) / (vb - va);
        return [lerp(xa, xb, t), lerp(ya, yb, t)];
      };
      for (const level of levels) {
        const cellPoints = [];
        for (let yi = 0; yi < ny - 1; yi++) {
          for (let xi = 0; xi < nx - 1; xi++) {
            const v00 = sample(xi, yi), v10 = sample(xi+1, yi);
            const v01 = sample(xi, yi+1), v11 = sample(xi+1, yi+1);
            if (v00 == null || v10 == null || v01 == null || v11 == null) continue;
            // cell corners in pixel space
            const x0 = lerp(xMin, xMax, xi / (nx-1));
            const x1 = lerp(xMin, xMax, (xi+1) / (nx-1));
            const y0 = lerp(yMax, yMin, yi / (ny-1));
            const y1 = lerp(yMax, yMin, (yi+1) / (ny-1));
            const idx = (v00 > level ? 1 : 0) | (v10 > level ? 2 : 0) | (v11 > level ? 4 : 0) | (v01 > level ? 8 : 0);
            if (idx === 0 || idx === 15) continue;
            const edges = [];
            if ((v00 > level) !== (v10 > level)) edges.push(lerpX(x0, y0, v00, x1, y0, v10, level));
            if ((v10 > level) !== (v11 > level)) edges.push(lerpX(x1, y0, v10, x1, y1, v11, level));
            if ((v01 > level) !== (v11 > level)) edges.push(lerpX(x0, y1, v01, x1, y1, v11, level));
            if ((v00 > level) !== (v01 > level)) edges.push(lerpX(x0, y0, v00, x0, y1, v01, level));
            if (edges.length >= 2) cellPoints.push(edges);
          }
        }
        flowCtx.beginPath();
        for (const seg of cellPoints) {
          flowCtx.moveTo(seg[0][0], seg[0][1]);
          flowCtx.lineTo(seg[1][0], seg[1][1]);
        }
        flowCtx.stroke();
        // label every 4th level
        if (cellPoints.length && level % 4 === 0 && cellPoints[0][0]) {
          const [lx, ly] = cellPoints[0][0];
          flowCtx.fillText(String(level), lx + 2, ly - 2);
        }
      }
    }

    // legacy alias (kept so the moveend/size handlers still call something safe)
    function drawWindOverlays() { drawStreamlines(); }

    // ---- wind particles (hint.fm-style, animated, layered ON TOP of streamlines) ----
    // Mike #34600: 'Wind particles are missing; add them on top of the streamlines
    // like a previous version which you did well.' Restored from d1074225 +
    // 5a1a9f54. Warm-yellow tints to match the streamline palette. Trail decay
    // via near-transparent dark wash each frame so old tails fade gently. dt is
    // speed × 0.0009 deg/frame for both wind (kn) and currents.
    let particleRaf = 0;
    let particleLast = 0;

    function seedWindParticles() {
      particles.length = 0;
      if (!forecastData || !mapEl) return;
      const rect = mapEl.getBoundingClientRect();
      const area = Math.max(1, rect.width * rect.height);
      const target = Math.max(280, Math.min(1100, Math.round(area / 1050)));
      for (let i = 0; i < target; i++) {
        const lon = bbox[0] + Math.random() * (bbox[2] - bbox[0]);
        const lat = bbox[1] + Math.random() * (bbox[3] - bbox[1]);
        particles.push({ lon, lat, age: Math.random() * 90, maxAge: 70 + Math.random() * 80 });
      }
      // Diagnostic — logs the first time particles are seeded after a frame change.
      if (!seedWindParticles._logged) {
        seedWindParticles._logged = true;
        console.log('[particles] seeded', target, 'across', bbox[2]-bbox[0], 'x', bbox[3]-bbox[1], 'deg');
      }
    }

    function startParticleAnimation() {
      if (particleRaf) return;
      if (!particles.length) seedWindParticles();
      const loop = (ts) => {
        particleRaf = requestAnimationFrame(loop);
        if (!currentFrame || !forecastData) {
          if (!startParticleAnimation._loggedNoFrame) {
            startParticleAnimation._loggedNoFrame = true;
            console.warn('[particles] skipped frame: currentFrame=', !!currentFrame, 'forecastData=', !!forecastData);
          }
          return;
        }
        if (ts - particleLast < 32) return; // ~30fps cap
        particleLast = ts;
        // resize if viewport changed
        const rect = mapEl.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const W = Math.max(1, Math.round(rect.width * dpr));
        const H = Math.max(1, Math.round(rect.height * dpr));
        if (flowCanvas.width !== W || flowCanvas.height !== H) {
          flowCanvas.width = W; flowCanvas.height = H;
          flowCanvas.style.width = rect.width + 'px';
          flowCanvas.style.height = rect.height + 'px';
        }
        const dprInv = flowCanvas.width / rect.width;
        flowCtx.setTransform(dprInv, 0, 0, dprInv, 0, 0);
        // trail decay (hint.fm recipe)
        flowCtx.globalCompositeOperation = 'source-over';
        flowCtx.globalAlpha = 1;
        flowCtx.fillStyle = 'rgba(7, 17, 29, 0.06)';
        flowCtx.fillRect(0, 0, rect.width, rect.height);
        // advect particles
        let drawn = 0;
        let respawned = 0;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const vec = bilinearVec(currentFrame, p.lon, p.lat);
          if (!vec || vec.speed < 2.5 || p.age >= p.maxAge ||
              p.lon < bbox[0] || p.lon > bbox[2] ||
              p.lat < bbox[1] || p.lat > bbox[3]) {
            const lon = bbox[0] + Math.random() * (bbox[2] - bbox[0]);
            const lat = bbox[1] + Math.random() * (bbox[3] - bbox[1]);
            particles[i] = { lon, lat, age: 0, maxAge: 70 + Math.random() * 80 };
            respawned++;
            continue;
          }
          const cosLat = Math.cos(p.lat * Math.PI / 180);
          const dt = vec.speed * 0.0009;
          const oldLon = p.lon, oldLat = p.lat;
          p.lon += (vec.u / vec.speed) * dt / cosLat;
          p.lat += (vec.v / vec.speed) * dt;
          p.age += 1;
          const before = ol.proj.fromLonLat([oldLon, oldLat], rasterProjection);
          const after  = ol.proj.fromLonLat([p.lon, p.lat], rasterProjection);
          const beforePx = map.getPixelFromCoordinate(before);
          const afterPx  = map.getPixelFromCoordinate(after);
          if (!beforePx || !afterPx) continue;
          // Speed → opacity + warm-yellow tint (matches static streamlines)
          const t = Math.min(1, vec.speed / 30);
          const fadeOut = Math.min(1, (1 - p.age / p.maxAge) * 1.5);
          const a = Math.max(0.18, Math.min(0.80, (0.35 + 0.45 * t) * fadeOut));
          const r = 255;
          const g = Math.round(220 + 20 * t);
          const b = Math.round(60 + 30 * t);
          flowCtx.globalAlpha = a;
          flowCtx.strokeStyle = `rgba(${r},${g},${b},1)`;
          flowCtx.lineWidth = 0.8 + 1.0 * t;
          flowCtx.lineCap = 'round';
          flowCtx.beginPath();
          flowCtx.moveTo(beforePx[0], beforePx[1]);
          flowCtx.lineTo(afterPx[0], afterPx[1]);
          flowCtx.stroke();
          drawn++;
        }
        flowCtx.globalAlpha = 1;
        if (!startParticleAnimation._loggedOnce) {
          startParticleAnimation._loggedOnce = true;
          console.log('[particles] first frame drawn=', drawn, 'respawned=', respawned, 'total=', particles.length);
        }
      };
      particleRaf = requestAnimationFrame(loop);
    }

    function stopParticleAnimation() {
      if (particleRaf) { cancelAnimationFrame(particleRaf); particleRaf = 0; }
      if (flowCtx && flowCanvas) flowCtx.clearRect(0, 0, flowCanvas.width, flowCanvas.height);
    }

    // ---- UI wiring ----
    function setProduct(key) {
      currentProduct = key;
      [...document.querySelectorAll('.bv-products button')].forEach(b => {
        b.classList.toggle('active', b.dataset.prod === key);
      });
      computeActiveRange();
      drawColorbar();
      map.render();
      drawOverlaysForProduct();
    }

    document.querySelectorAll('.bv-products button').forEach(btn => {
      btn.addEventListener('click', () => setProduct(btn.dataset.prod));
    });

    document.getElementById('bv-prev').addEventListener('click', () => {
      setFrame(frameIdx - 1);
      pause();
    });
    document.getElementById('bv-next').addEventListener('click', () => {
      setFrame(frameIdx + 1);
      pause();
    });
    document.getElementById('bv-slider').addEventListener('input', e => {
      setFrame(parseInt(e.target.value, 10));
      pause();
    });
    const playBtn = document.getElementById('bv-play');
    function pause() {
      if (playTimer) { clearInterval(playTimer); playTimer = null; }
      playBtn.textContent = '▶'; playBtn.classList.remove('playing');
    }
    function play() {
      pause();
      playBtn.textContent = '⏸'; playBtn.classList.add('playing');
      playTimer = setInterval(() => {
        if (!forecastData) return;
        const next = (frameIdx + 1) % forecastData.frames.length;
        setFrame(next);
      }, 800);
    }
    playBtn.addEventListener('click', () => { playTimer ? pause() : play(); });

    map.on('moveend', () => { drawOverlaysForProduct(); });
    map.on('change:size', () => {
      // re-seed particles to new viewport area, redraw
      seedWindParticles();
      drawOverlaysForProduct();
    });

    // ---- bootstrap ----
    (async () => {
      try {
        forecastData = await fetchJson(FORECAST_URL);
        // Dev carries a NOAA GFS diagnostic payload while the shared feed is
        // migrated off Open-Meteo. Use it only when the shared payload lacks
        // the expanded integration field; production stays on the canonical
        // data host.
        if (window.location.hostname.startsWith('feat-') &&
            (!Array.isArray(forecastData.bbox) || forecastData.bbox[0] > -79)) {
          try { forecastData = await fetchJson(DEV_FORECAST_URL); }
          catch (fallbackError) { console.warn('[forecast] dev fallback unavailable', fallbackError); }
        }
        fieldBbox = Array.isArray(forecastData.field_bbox || forecastData.bbox)
          ? (forecastData.field_bbox || forecastData.bbox)
          : bbox;
        drawDomainDiagnostics();
        const generatedAt = Date.parse(forecastData && forecastData.generated_at);
        if (!Number.isFinite(generatedAt)) {
          throw new Error('forecast missing generated_at provenance');
        }
        const maxAgeHours = Number(forecastData.quality && forecastData.quality.max_age_hours) || MAX_FORECAST_AGE_HOURS;
        const ageHours = (Date.now() - generatedAt) / 3600000;
        const ageLabel = ageHours > maxAgeHours
          ? `STALE · ${ageHours.toFixed(1)}h old · limit ${maxAgeHours}h`
          : `fresh · ${ageHours.toFixed(1)}h old`;
        document.getElementById('bv-time').textContent = `7-Day Outlook · ${ageLabel}`;
        if (ageHours > maxAgeHours) {
          console.warn(`[forecast] rendering stale data: ${ageLabel}`);
        }
        if (forecastData.quality && forecastData.quality.status !== 'pass') {
          throw new Error('forecast failed its upstream quality gate');
        }
        if (!forecastData.quality) {
          console.warn('forecast is fresh but lacks quality metadata; treating as legacy-unvalidated');
        }
        const frames = forecastData.frames || [];
        if (!frames.length) {
          document.getElementById('bv-frame-label').textContent = 'no frames';
          return;
        }
        const startIdx = nearestFrameIdxToDate(frames, targetDate);
        const slider = document.getElementById('bv-slider');
        slider.min = '0';
        slider.max = String(frames.length - 1);
        slider.value = String(startIdx);
        frameIdx = startIdx;
        currentFrame = frames[startIdx];
        drawColorbar();
        setFrame(startIdx);
        map.getView().fit(devDiagnostics ? fieldBbox : bbox, { padding: [10, 10, 60, 10] });
        // soft auto-play so the planner viewer visibly lives
        // (Mike's directive: looks like captain's dashboard, not a static PNG)
        play();
      } catch (e) {
        document.getElementById('bv-frame-label').textContent = 'load failed: ' + e.message;
        console.error(e);
      }
    })();
  })();
  </script>
</body>
</html>
