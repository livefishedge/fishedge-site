<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FishEdge — Signing out</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b10;color:#e0e6ee;font:16px system-ui,sans-serif}
  </style>
</head>
<body>
  <p>Signing out…</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js?v=20260726"></script>
<script src="supabase-init.js?v=20260804"></script>
  <script>
    (async function () {
      try { if (window.sb) await window.sb.auth.signOut(); } catch (_) {}
      try { document.cookie = 'fishedge_logged_in=; Path=/; Domain=.fishedge.live; Max-Age=0; Secure; SameSite=Lax'; } catch (_) {}
      window.location.replace('https://fishedge.live/');
    })();
  </script>
</body>
</html>
