<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose New Password — FishEdge</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg:#050b10; --fg:#e0e6ee; --accent:#1a7f7a; --accent2:#2dd4bf; --panel:rgba(5,11,16,.95); --border:#1b2836; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; }
    #card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:40px 36px; max-width:400px; width:90%; }
    h1 { font-size:22px; color:var(--accent2); margin-bottom:8px; }
    .subtitle { color:#7a8fa6; font-size:13px; line-height:1.5; margin-bottom:24px; }
    label { display:block; font-size:12px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#0c1723; color:var(--fg); font-size:14px; outline:none; }
    input:focus { border-color:var(--accent); }
    button { width:100%; padding:11px; margin-top:18px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
    button:hover { background:#1a9e92; } button:disabled { opacity:.5; cursor:not-allowed; }
    #msg { min-height:20px; margin-top:14px; text-align:center; font-size:13px; line-height:1.4; }
    .success { color:#2dd4bf; } .error { color:#f87171; }
    .back { text-align:center; margin-top:18px; font-size:12px; opacity:.7; }
    a { color:var(--accent2); text-decoration:none; } a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <main id="card">
    <h1>Choose a new password</h1>
    <p class="subtitle">Use at least 8 characters with an uppercase letter, lowercase letter, and number.</p>
    <form id="reset-form" novalidate>
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" required />
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" required />
      <button type="submit" id="submit-btn">Update password</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="back"><a href="login.html">Back to sign in</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js?v=20260531"></script>
  <script src="supabase-init.js?v=20260711"></script>
  <script>
    (function () {
      var form = document.getElementById('reset-form');
      var password = document.getElementById('password');
      var confirm = document.getElementById('confirm');
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('msg');
      function show(text, cls) { msg.textContent = text; msg.className = cls || ''; }
      function valid(value) { return value.length >= 8 && /[A-Z]/.test(value) && /[a-z]/.test(value) && /[0-9]/.test(value); }

      sb.auth.getSession().then(function (result) {
        if (!result.data || !result.data.session) show('This reset link is invalid or has expired. Request a new one.', 'error');
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (!valid(password.value)) { show('Use at least 8 characters with uppercase, lowercase, and a number.', 'error'); return; }
        if (password.value !== confirm.value) { show('Passwords do not match.', 'error'); return; }
        btn.disabled = true;
        btn.textContent = 'Updating…';
        var result = await sb.auth.updateUser({ password: password.value });
        if (result.error) {
          show(result.error.message || 'Could not update password. Request a new reset link.', 'error');
          btn.disabled = false;
          btn.textContent = 'Update password';
          return;
        }
        show('Password updated. You can now sign in.', 'success');
        btn.textContent = 'Password updated';
        setTimeout(function () { window.location.replace('login.html'); }, 1200);
      });
    })();
  </script>
</body>
</html>
