name: Refresh native tidal stage

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-data-publish
  cancel-in-progress: false

jobs:
  native-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native stage dependencies
        run: python -m pip install --disable-pip-version-check requests numpy scipy netcdf4 pillow opencv-python-headless
      - name: Discover current NOAA STOFS HTP cycle
        id: source
        run: |
          source_key="$(python - <<'PY'
          import datetime as dt
          from scripts.fetch_stofs_global_harmonics import find_htp
          today = dt.datetime.now(dt.timezone.utc).strftime('%Y%m%d')
          for cycle in ('00', '06', '12', '18'):
              try:
                  print(find_htp(today, cycle))
                  break
              except Exception:
                  pass
          else:
              raise SystemExit('no current NOAA STOFS HTP source cycle')
          PY
          )"
          echo "key=$source_key" >> "$GITHUB_OUTPUT"
          echo "url=https://noaa-gestofs-pds.s3.amazonaws.com/$source_key" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$source_key" | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - name: Build compact regional mesh caches
        run: |
          mkdir -p /tmp/native_mesh
          python scripts/build_native_mesh_cache.py --source-url '${{ steps.source.outputs.url }}' \
            --cache /tmp/native_mesh/usec_md.npz --bbox -76.5 35.5 -71.5 40.5
          python scripts/build_native_mesh_cache.py --source-url '${{ steps.source.outputs.url }}' \
            --cache /tmp/native_mesh/usec_south.npz --bbox -81 31 -73 36
      - name: Generate native stage tiles from the same mesh as co-range
        run: |
          # Native tides have an independent source horizon. Build every
          # source-valid hour; never ask the native builder to manufacture
          # weather frames it cannot authoritatively provide.
          for region in usec_md usec_south; do
            python scripts/build_native_tide_phase_tiles.py --source-url '${{ steps.source.outputs.url }}' \
              --source-object '${{ steps.source.outputs.key }}' --asset-version '${{ steps.source.outputs.version }}' \
              --mesh-cache "/tmp/native_mesh/$region.npz" \
              --forecast "data/$region/briefing/forecast.json" \
              --out-dir "dashboard/trip-planner/data/$region/briefing/native_phase_tiles" \
              --frames 0
            python scripts/build_native_tide_phase_tiles.py --source-url '${{ steps.source.outputs.url }}' \
              --source-object '${{ steps.source.outputs.key }}' --asset-version '${{ steps.source.outputs.version }}' \
              --mesh-cache "/tmp/native_mesh/$region.npz" \
              --forecast "dashboard/trip-planner/data/$region/briefing/forecast.json" \
              --out-dir "dashboard/trip-planner/data/$region/briefing/native_phase_tiles" \
              --frames 0
          done
          python scripts/disable_stale_native_phase.py \
            data/usec_md/briefing/forecast.json \
            dashboard/trip-planner/data/usec_md/briefing/forecast.json \
            data/usec_south/briefing/forecast.json \
            dashboard/trip-planner/data/usec_south/briefing/forecast.json
      - name: Validate native coverage and artifacts
        run: |
          python scripts/validate_forecast_artifact.py data/usec_md/briefing/forecast.json
          python scripts/validate_forecast_artifact.py dashboard/trip-planner/data/usec_md/briefing/forecast.json
          python scripts/validate_forecast_artifact.py data/usec_south/briefing/forecast.json
          python scripts/validate_forecast_artifact.py dashboard/trip-planner/data/usec_south/briefing/forecast.json
          test "$(find dashboard/trip-planner/data/usec_md/briefing/native_phase_tiles -name 'frame-*.png' | wc -l)" -gt 0
          test "$(find dashboard/trip-planner/data/usec_south/briefing/native_phase_tiles -name 'frame-*.png' | wc -l)" -gt 0
      - name: Commit and publish the verified native bundle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
        run: |
          git config user.name 'FishEdge native tide refresh'
          git config user.email 'actions@users.noreply.github.com'
          git add data/usec_md/briefing/forecast.json dashboard/trip-planner/data/usec_md/briefing/forecast.json
          git add data/usec_south/briefing/forecast.json dashboard/trip-planner/data/usec_south/briefing/forecast.json
          git add dashboard/trip-planner/data/usec_md/briefing/native_phase_tiles dashboard/trip-planner/data/usec_south/briefing/native_phase_tiles
          git diff --cached --quiet || git commit -m 'chore: refresh native coastal tidal stage'
          git push
          endpoint='https://5fec32b363f766a68734c384d1890cb1.r2.cloudflarestorage.com'
          for region in usec_md usec_south; do
            aws s3 cp "data/$region/briefing/forecast.json" "s3://fishedge-data/$region/briefing/forecast.json" --endpoint-url "$endpoint" --cache-control 'no-cache, max-age=0'
            for file in "dashboard/trip-planner/data/$region/briefing/native_phase_tiles"/z*/*/*/*.png; do
              [ -f "$file" ] || continue
              key="${file#dashboard/trip-planner/data/$region/briefing/}"
              aws s3 cp "$file" "s3://fishedge-data/$region/briefing/$key" --endpoint-url "$endpoint" --cache-control 'public, max-age=3600'
            done
          done
