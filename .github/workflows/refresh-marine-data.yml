name: Refresh marine and tidal data

on:
  push:
    paths:
      - '.github/workflows/refresh-marine-data.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marine-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check requests numpy scipy xarray netcdf4 pillow opencv-python-headless
      - name: Refresh wave/weather forecast and CO-OPS observations
        run: |
          python scripts/fetch_wave_openmeteo.py
          FISHEDGE_REGION=usec_south python scripts/fetch_wave_openmeteo.py
          python scripts/refresh_tide_measurements.py \
            data/usec_md/briefing/forecast.json \
            dashboard/trip-planner/data/usec_md/briefing/forecast.json \
            data/usec_south/briefing/forecast.json \
            dashboard/trip-planner/data/usec_south/briefing/forecast.json
          # Preserve a valid native atlas across rolling weather timestamps.
          # Native regeneration is handled by the dedicated six-hour job.
          python scripts/disable_stale_native_phase.py \
            data/usec_md/briefing/forecast.json \
            dashboard/trip-planner/data/usec_md/briefing/forecast.json \
            data/usec_south/briefing/forecast.json \
            dashboard/trip-planner/data/usec_south/briefing/forecast.json
      - name: Merge NOAA OFS currents and sea-surface height when available
        continue-on-error: true
        run: |
          python scripts/fetch_ofs_tidal_forecast.py \
            --date "$(date -u +%Y%m%d)" --hours 72 \
            --merge-forecast data/usec_md/briefing/forecast.json \
            --merge-forecast dashboard/trip-planner/data/usec_md/briefing/forecast.json
      - name: Validate refreshed forecast artifacts
        run: |
          python scripts/validate_forecast_artifact.py data/usec_md/briefing/forecast.json
          python scripts/validate_forecast_artifact.py dashboard/trip-planner/data/usec_md/briefing/forecast.json
          python scripts/validate_forecast_artifact.py data/usec_south/briefing/forecast.json
          python scripts/validate_forecast_artifact.py dashboard/trip-planner/data/usec_south/briefing/forecast.json
      - name: Commit refreshed artifacts
        run: |
          git config user.name 'FishEdge data refresh'
          git config user.email 'actions@users.noreply.github.com'
          git add data/usec_md/briefing/forecast.json dashboard/trip-planner/data/usec_md/briefing/forecast.json
          git add data/usec_md/briefing/frames/forecast-frames-*.json dashboard/trip-planner/data/usec_md/briefing/frames/forecast-frames-*.json
          git add data/usec_south/briefing/forecast.json dashboard/trip-planner/data/usec_south/briefing/forecast.json
          git add data/usec_south/briefing/frames/forecast-frames-*.json dashboard/trip-planner/data/usec_south/briefing/frames/forecast-frames-*.json
          git add dashboard/trip-planner/data/usec_md/briefing/native_phase_tiles || true
          git add dashboard/trip-planner/data/usec_south/briefing/native_phase_tiles || true
          if [ -f data/usec_md/briefing/tidal_forecast.json ]; then git add data/usec_md/briefing/tidal_forecast.json; fi
          git diff --cached --quiet || git commit -m "chore: refresh marine and CO-OPS data"
          git push
      - name: Sync current briefing artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo '::error::R2 credentials are not configured; refusing to leave data.fishedge.live stale'
            exit 1
          fi
          endpoint='https://5fec32b363f766a68734c384d1890cb1.r2.cloudflarestorage.com'
          for region in usec_md usec_south; do
            aws s3 cp "data/$region/briefing/forecast.json" \
              "s3://fishedge-data/$region/briefing/forecast.json" \
              --endpoint-url "$endpoint" --cache-control 'no-cache, max-age=0'
            for file in "data/$region/briefing/frames/"forecast-frames-*.json; do
              aws s3 cp "$file" "s3://fishedge-data/$region/briefing/frames/$(basename "$file")" \
                --endpoint-url "$endpoint" --cache-control 'no-cache, max-age=0'
            done
            if [ -d "dashboard/trip-planner/data/$region/briefing/native_phase_tiles" ]; then
              for file in "dashboard/trip-planner/data/$region/briefing/native_phase_tiles"/z*/*/*/*.png; do
                [ -f "$file" ] || continue
                key="${file#dashboard/trip-planner/data/$region/briefing/}"
                aws s3 cp "$file" "s3://fishedge-data/$region/briefing/$key" \
                  --endpoint-url "$endpoint" --cache-control 'public, max-age=3600'
              done
            fi
            mask="dashboard/trip-planner/data/$region/briefing/native_wave_mask.png"
            if [ ! -s "$mask" ]; then
              echo "::error::missing regional water mask: $mask"
              exit 1
            fi
            aws s3 cp "$mask" "s3://fishedge-data/$region/briefing/native_wave_mask.png" \
              --endpoint-url "$endpoint" --cache-control 'no-cache, max-age=0'
          done
