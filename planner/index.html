<body>
  <!-- Tab switcher mounts at the very top -->
  <nav id="fishedge-tab-switcher" aria-label="Primary"></nav>

  <!-- Inlet picker strip sits below the tabs -->
  <header id="fishedge-inlet-picker"></header>

  <!-- Main planner body: 5-day outlook (center), My Trips (sidebar on desktop, drawer on mobile) -->
  <main id="fishedge-planner-main">
    <section id="fishedge-five-day-outlook" aria-label="5-day outlook"></section>
    <aside id="fishedge-my-trips" aria-label="Saved trips"></aside>
  </main>

  <!-- Compact conditions strip mounts bottom-right (mobile) or top-right (desktop) -->
  <div id="fishedge-compact-strip-host"></div>

  <!-- Briefing drawer mounts as a portal overlay -->
  <div id="fishedge-briefing-host"></div>

  <noscript>
    <div style="padding:20px;color:#e0e6ee;background:#050b10;font:14px-system-ui;">
