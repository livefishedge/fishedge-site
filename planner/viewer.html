<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FishEdge Forecast Viewer</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css"><style>html,body{margin:0;height:100%;background:#07111d;color:#dcecf7;font:14px system-ui}#map{position:absolute;inset:54px 0 0}.bar{height:54px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#0a1929;border-bottom:1px solid #23445a;position:relative;z-index:2}.bar a{color:#66d9ff;text-decoration:none}.bar h1{font-size:16px;margin:0}.bar label{margin-left:auto;color:#c8e9f5}.bar input{accent-color:#55d9ff}.ol-control button{background:#0a1929!important;color:#dcecf7!important}.legend{position:absolute;z-index:3;left:12px;bottom:12px;background:#0a1929e8;border:1px solid #31546b;padding:9px 11px;border-radius:5px;color:#9fdcf1;font-size:12px}</style></head><body><header class="bar"><a href="/planner/">← Forecast Planner</a><h1 id="title">Forecast Viewer</h1><label><input id="layer" type="checkbox"> CMEMS ocean layer</label></header><div id="map"></div><div class="legend">Pan / zoom · raster bbox USEC Mid-Atlantic<br>Open-Meteo: wind + waves · CMEMS: SST + currents</div><script type="module">
import Map from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/Map.js';import View from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/View.js';import ImageLayer from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/layer/Image.js';import ImageStatic from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/source/ImageStatic.js';import {Projection} from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/proj.js';import {fromLonLat,transformExtent} from 'https://cdn.jsdelivr.net/npm/ol@10.2.1/proj.js';
const q=new URLSearchParams(location.search),date=q.get('date')||new Date().toISOString().slice(0,10),region=q.get('region')||'usec_md',bbox=[-77,36,-72,40],extent=transformExtent(bbox,'EPSG:4326','EPSG:3857'),base='https://data.fishedge.live/'+region+'/briefing/';document.getElementById('title').textContent='Forecast Viewer · '+date;
const projection=new Projection({code:'EPSG:3857'}),om=new ImageLayer({source:new ImageStatic({url:base+'raster_'+date+'.png',imageExtent:extent,projection})}),cm=new ImageLayer({source:new ImageStatic({url:base+'cmems_raster_'+date+'.png',imageExtent:extent,projection}),visible:false});const map=new Map({target:'map',layers:[om,cm],view:new View({center:fromLonLat([-74.5,38]),zoom:7,minZoom:5,maxZoom:13})});document.getElementById('layer').addEventListener('change',e=>{om.setVisible(!e.target.checked);cm.setVisible(e.target.checked)});
</script></body></html>
