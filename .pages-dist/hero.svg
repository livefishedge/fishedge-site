<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Live marine intelligence map preview">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f2e"/>
      <stop offset="50%" stop-color="#0e3a52"/>
      <stop offset="100%" stop-color="#07283d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dd4d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dd4d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3dd4d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b945" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b945" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f5b945" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b945" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f5b945" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d3e" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#ocean)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Coastline silhouette (US East Coast stylized) -->
  <path d="M 0 100 Q 80 130 120 180 T 180 280 Q 200 340 220 420 L 250 600 L 0 600 Z"
        fill="#06121c" opacity="0.85"/>

  <!-- Productivity edges (chlorophyll/temperature boundaries) -->
  <path d="M 200 250 Q 350 240 500 270 T 800 290" stroke="url(#edge)" stroke-width="3" fill="none"/>
  <path d="M 240 320 Q 400 310 550 340 T 800 360" stroke="url(#edge)" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 280 380 Q 420 370 580 400 T 800 420" stroke="url(#warm)" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Current arrows (UV vectors) -->
  <g fill="#3dd4d4" opacity="0.7">
    <polygon points="320,180 335,185 320,190"/>
    <polygon points="420,200 435,205 420,210"/>
    <polygon points="520,220 535,225 520,230"/>
    <polygon points="620,240 635,245 620,250"/>
    <polygon points="370,440 385,445 370,450"/>
    <polygon points="470,460 485,465 470,470"/>
    <polygon points="570,480 585,485 570,490"/>
  </g>

  <!-- Productivity hotspot -->
  <ellipse cx="500" cy="320" rx="120" ry="60" fill="url(#hotspot)"/>

  <!-- Saved spot markers (pilot features) -->
  <g>
    <circle cx="380" cy="290" r="6" fill="#3dd4d4"/>
    <circle cx="380" cy="290" r="14" fill="none" stroke="#3dd4d4" stroke-width="1.5" opacity="0.7"/>
    <circle cx="560" cy="350" r="6" fill="#f5b945"/>
    <circle cx="560" cy="350" r="14" fill="none" stroke="#f5b945" stroke-width="1.5" opacity="0.7"/>
    <circle cx="680" cy="280" r="6" fill="#3dd4d4"/>
    <circle cx="680" cy="280" r="14" fill="none" stroke="#3dd4d4" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Region label -->
  <text x="40" y="50" fill="#8aa0b3" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="2">
    USEC SOUTH · LIVE
  </text>
  <text x="40" y="560" fill="#8aa0b3" font-family="system-ui" font-size="11" font-weight="600">
    Productivity edges · thermal fronts · current vectors · saved spots
  </text>
</svg>