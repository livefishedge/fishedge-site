<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FishEdge — Trips</title><link rel="icon" href="data:,"><style>body{margin:0;background:#07111d;color:#dcecf7;font:14px system-ui;padding:24px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24465d;padding-bottom:14px}.top a{color:#67d9ff;text-decoration:none;margin-left:12px}.trip{padding:14px;margin:10px 0;background:#0a1929;border:1px solid #24465d;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.trip small{display:block;color:#91afc0;margin-top:5px}.trip a,.trip button{color:#67d9ff;background:none;border:0;cursor:pointer;text-decoration:none;margin-left:10px}.trip button{color:#ff9b9b}.empty{color:#7898aa;padding:24px 0}</style></head><body><main><header class="top"><h1>Trips</h1><nav><a href="/planner/">Planner</a><a href="/">Home</a></nav></header><h2>Upcoming Trips</h2><div id="upcoming"></div><h2>Past Trips</h2><div id="past"></div></main><script src="/dashboard/trip-planner/storage.js?v=20260914a"></script><script>(function(){const key='fishedge:planner:trips';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let ts=[];try{ts=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){};const groups={upcoming:ts.filter(t=>t.status!=='completed'&&t.status!=='cancelled'),past:ts.filter(t=>t.status==='completed'||t.status==='cancelled')};for(const [name,arr] of Object.entries(groups)){const el=document.getElementById(name);if(!arr.length){el.innerHTML='<div class="empty">No '+name+' trips.</div>';continue}el.innerHTML=arr.map(t=>'<div class="trip"><div><strong>'+esc(t.name||'Untitled trip')+'</strong><small>'+esc(t.inlet_key||'Unknown inlet')+' · '+(t.departure_iso?new Date(t.departure_iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric'}):'No departure')+' · '+esc(t.status||'draft')+'</small></div><div><a href="/planner/?new=1&trip_id='+encodeURIComponent(t.id)+'">Edit</a><button data-remove="'+esc(t.id)+'">Remove</button></div></div>').join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const id=b.dataset.remove;ts=ts.filter(t=>t.id!==id);localStorage.setItem(key,JSON.stringify(ts));render()})}}render()})();</script></body></html>

<script>(function(){var n=document.querySelector('nav');if(n){var a=n.querySelector('a[href="/planner/?new=1"]');if(a)a.remove();if(!n.querySelector('a[href="/planner/"]')){a=document.createElement('a');a.href='/planner/';a.textContent='Planner';n.insertBefore(a,n.firstChild)}}})();</script>
